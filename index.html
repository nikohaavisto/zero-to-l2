  const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p2 = n => String(n).padStart(2, '0');
  const sp2 = n => String(n).padStart(2, ' ');
  const D = ms => new Date(ms);
  const hms = d => `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`;
  const fmt = {
    ctime: ms => { const d = D(ms); return `${DAYS[d.getUTCDay()]} ${MONS[d.getUTCMonth()]} ${sp2(d.getUTCDate())} ${hms(d)} ${d.getUTCFullYear()}`; },
    journal: ms => { const d = D(ms); return `${MONS[d.getUTCMonth()]} ${p2(d.getUTCDate())} ${hms(d)}`; },
    iso: ms => { const d = D(ms); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}T${hms(d)}.${String(ms % 1000).padStart(3,'0')}412+03:00`; },
    long: ms => { const d = D(ms); return `${DAYS[d.getUTCDay()]} ${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())} ${hms(d)} EEST`; },
    date: ms => { const d = D(ms); return `${DAYS[d.getUTCDay()]} ${MONS[d.getUTCMonth()]} ${sp2(d.getUTCDate())} ${hms(d)} EEST ${d.getUTCFullYear()}`; },
    sel: ms => { const d = D(ms); return `${p2(d.getUTCMonth()+1)}/${p2(d.getUTCDate())}/${d.getUTCFullYear()} | ${hms(d)}`; },
    ls: ms => { const d = D(ms); return `${MONS[d.getUTCMonth()]} ${sp2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; },
  };
  const at = s => BOOT + Math.round(s * 1000);

  /* ---------- kernel ring buffer: [secondsSinceBoot, level, message] ---------- */
  const EDAC = (n, pg, off) => `EDAC MC1: ${n} CE memory read error on CPU_SrcID#1_MC#1_Chan#0_DIMM#0 (channel:0 slot:0 page:0x${pg} offset:0x${off} grain:32 syndrome:0x0 - err_code:0x0000:0x009f SystemAddress:0x${pg}${off} ProcessorSocketId:0x1 MemoryControllerId:0x1 ChannelId:0x0 DimmSlotId:0x0 Row:0x7a21 Column:0x3c8 Bank:0x2 BankGroup:0x1)`;
  const FLAP = [2834117.55, 3120044.10, 3301877.42, 3402551.90, 3470190.33, 3512006.71, 3549512.08];
  const KERN = [
    [0.000000, 'notice', 'Linux version 6.8.0-45-generic (buildd@lcy02-amd64-075) (x86_64-linux-gnu-gcc-13 (Ubuntu 13.2.0-23ubuntu4) 13.2.0, GNU ld (GNU Binutils for Ubuntu) 2.42) #45-Ubuntu SMP PREEMPT_DYNAMIC Fri Aug 30 12:02:04 UTC 2024'],
    [0.000000, 'info', 'Command line: BOOT_IMAGE=/vmlinuz-6.8.0-45-generic root=UUID=e2b5c0d1-4f3a-4c8e-9a51-6d2f0b7e8c11 ro console=tty0 console=ttyS1,115200n8'],
    [0.004211, 'info', 'DMI: Supermicro SYS-821GE-TNHR/X13DEG-OAD, BIOS 2.1 03/12/2025'],
    [0.112004, 'info', 'smpboot: Allowing 224 CPUs, 0 hotplug CPUs'],
    [0.531877, 'info', 'Memory: 2111872404K/2147003396K available (20480K kernel code, 4402K rwdata, 14412K rodata)'],
    [1.204551, 'info', 'EDAC MC0: Giving out device to module i10nm_edac controller Intel_10nm Socket#0 IMC#0: DEV 0000:7e:0c.0 (INTERRUPT)'],
    [1.204890, 'info', 'EDAC MC1: Giving out device to module i10nm_edac controller Intel_10nm Socket#1 IMC#1: DEV 0000:fe:0c.0 (INTERRUPT)'],
    [1.882113, 'info', 'mlx5_core 0000:b1:00.0: firmware version: 22.39.1002'],
    [1.901334, 'info', 'mlx5_core 0000:b1:00.1: firmware version: 22.39.1002'],
    [2.120771, 'info', 'igb 0000:05:00.0 eno1: renamed from eth0'],
    [2.441900, 'warn', 'nvidia: loading out-of-tree module taints kernel.'],
    [3.010442, 'info', 'NVRM: loading NVIDIA UNIX x86_64 Kernel Module  550.90.07  Fri May 31 09:35:42 UTC 2024'],
    [4.412870, 'info', 'md/raid1:md0: active with 2 out of 2 mirrors'],
    [4.413902, 'info', 'md0: detected capacity change from 0 to 3905716224'],
    [5.021774, 'info', 'EXT4-fs (md0): mounted filesystem e2b5c0d1-4f3a-4c8e-9a51-6d2f0b7e8c11 ro with ordered data mode. Quota mode: none.'],
    [7.330012, 'info', 'EXT4-fs (md0): re-mounted e2b5c0d1-4f3a-4c8e-9a51-6d2f0b7e8c11 r/w. Quota mode: none.'],
    [9.118230, 'notice', 'XFS (nvme0n1): Mounting V5 Filesystem a91f3c22-7b1e-4d0a-b6e2-3f8c1d9e2a70'],
    [9.402119, 'info', 'XFS (nvme0n1): Ending clean mount'],
    [12.301556, 'info', 'mlx5_core 0000:b1:00.0 ens1f0: Link up'],

    [3002411.21, 'warn', EDAC(1, '1e34a7', '780')],

    [3311004.02, 'warn', EDAC(7, '1e34b1', '040')],
    [3399871.47, 'warn', EDAC(12, '1e34a7', '780')],
    [3460233.90, 'warn', EDAC(25, '1e34a9', '1c0')],
    [3530117.18, 'warn', EDAC(41, '1e34a7', '780')],
    [3480137.20, 'err', 'sd 1:0:0:0: [sdb] tag#12 FAILED Result: hostbyte=DID_OK driverbyte=DRIVER_OK cmd_age=7s'],

  function globMatch(m, pattern, eu) {

  function runPipeline(m, seg, capture) {

  function readFileFor(m, path, eu, cmd) {

  function execCmd(m, words, stdin, tty) {

  function runScript(m, name, args, eu, stdin, viaShell) {

  function execScriptText(m, text, abs, eu) {

    el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');
    const r = target.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight, vw = window.innerWidth, vh = window.innerHeight, m = 12;
    let top = r.bottom + 10;
    if (top + h > vh - m && r.top - 10 - h > 60) top = r.top - 10 - h;
    top = Math.max(60, Math.min(top, vh - h - m));
    let left = r.width > 220 ? r.left + 28 : r.left + r.width / 2 - w / 2;
    left = Math.max(m, Math.min(left, vw - w - m));
    el.style.top = top + 'px';
    el.style.left = left + 'px';
    const close = el.querySelector('[data-peek-close]');
    if (close) close.addEventListener('click', hidePeek);
  }
  function hidePeek() { clearTimeout(peekT); if (peekEl) peekEl.hidden = true; peekFor = null; }
  function bindPeek(root) {
    const hover = canHover();
    root.querySelectorAll('[data-peek]').forEach(el => {
      const id = el.dataset.peek;
      if (hover) {
        el.addEventListener('mouseenter', () => { clearTimeout(peekT); peekT = setTimeout(() => showPeek(el, id, false), 140); });
        el.addEventListener('mouseleave', () => { clearTimeout(peekT); peekT = setTimeout(hidePeek, 80); });
      }
      el.addEventListener('focus', () => { if (el.matches(':focus-visible')) showPeek(el, id, false); });
      el.addEventListener('blur', () => { if (!(peekEl && peekEl.classList.contains('touch'))) hidePeek(); });
    });
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePeek(); });
  document.addEventListener('click', e => { if (peekEl && !peekEl.hidden && !e.target.closest('.peek') && !e.target.closest('[data-peek]')) hidePeek(); });
  window.addEventListener('scroll', () => { if (peekEl && !peekEl.hidden) hidePeek(); }, { passive: true });

  /* ================= views ================= */
  function setTab(t) { document.querySelectorAll('.tabs a').forEach(a => { if (a.dataset.tab === t) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }); }
  function nextLesson() {
    if (P.last && BYID[P.last] && !isDone(P.last)) return BYID[P.last];
    return LESSONS.find(l => !isDone(l.id)) || LESSONS[LESSONS.length - 1];
  }
  function afterRender() {
    reveal(app);
    glitchOnce($('h1.glitch', app));
  }

  function installHint() {
    if (!document.querySelector('link[rel="manifest"]')) return '';
    const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
    if (standalone) return '';
    return `<div class="move frame rv"><h3>Install as an app</h3>
      <p><b style="color:var(--ink)">iPhone:</b> open this page in Safari, tap Share, then Add to Home Screen.</p>
      <p><b style="color:var(--ink)">Mac:</b> open this page in Safari, then File → Add to Dock.</p>
      <p>Once installed it opens full-screen and works offline.</p></div>`;
  }

  function viewHome() {
    setTab('course'); curLesson = null; termEl = null;
    const doneN = LESSONS.filter(l => isDone(l.id)).length;
    const tasksN = ALLTASKS.filter(k => P.tasks[k]).length;
    const qs = Object.values(P.quiz);
    const avg = qs.length ? Math.round(qs.reduce((s, q) => s + q.s / q.t, 0) / qs.length * 100) : null;
    const confN = ALLQ.filter(q => isConf(q.k)).length;
    const nx = nextLesson();
    const all = doneN === LESSONS.length;
    let pi = 0;
    app.innerHTML = `<div class="page"><div class="col">
      <p class="eyebrow">Google DCT II prep</p>
      ${H1('Zero to L2 Technician')}
      <p class="lede">From no Linux to ready for Google's <b>Data Center Technician II</b> technical round. 50 lessons over 10 weeks, 20–30 minutes a day, with a simulated server you're allowed to break.</p>
      <div class="panel frame" aria-label="Progress: one port per lesson">
        <div class="panel-head"><strong>${doneN}/${LESSONS.length}</strong><span>lessons patched in</span></div>
        <div class="ports">${D.weeks.map(w => `<div class="pgroup"><div class="prow">${w.lessons.map(l => `<button type="button" style="--i:${pi++}" class="port ${lessonState(l)}${l.id === nx.id && !all ? ' next' : ''}" data-go="${l.id}" data-peek="${l.id}" aria-label="${esc(code(l) + ': ' + l.title + (isDone(l.id) ? ', complete' : ''))}" title="${esc(code(l) + ' ' + l.title)}"></button>`).join('')}</div><span class="plabel">W${w.n}</span></div>`).join('')}</div>
        <div class="stats"><span><b>${tasksN}</b>/${ALLTASKS.length} tasks</span><span><b>${avg == null ? '––' : avg + '%'}</b> quiz avg</span><span><b>${confN}</b>/${ALLQ.length} interview ready</span></div>
      </div>
      <div class="upnext frame rv">
        <div class="hazard" aria-hidden="true"></div>
        <p class="sec-label" style="margin:0">${all ? 'Course complete' : 'Up next'}</p>
        <div class="row"><span class="tag">${code(nx)}</span><span class="mins">${nx.min} min</span></div>
        <h2>${esc(nx.title)}</h2>
        <p>${nx.goal}</p>
        <div class="row"><a class="btn hot" href="#${nx.id}">${doneN === 0 ? 'Jack in' : all ? 'Review' : 'Continue'}</a><a class="btn ghost" href="#interview">Interview practice</a></div>
      </div>
      ${LABEL('', 'All lessons')}
      <div class="weeks">${D.weeks.map(w => {
        const dn = w.lessons.filter(l => isDone(l.id)).length;
        return `<details class="week frame rv"${w.n === nx.week ? ' open' : ''}>
          <summary><span class="wk-n">WK${String(w.n).padStart(2, '0')}</span><span class="wk-t">${esc(w.title)}</span><span class="wk-c">${dn}/${w.lessons.length}</span><p class="wk-s">${esc(w.summary)}</p></summary>
          <ul class="lessons">${w.lessons.map((l, i) => `<li style="--i:${i}"><a href="#${l.id}" data-peek="${l.id}"><span class="tag">${code(l)}</span><span class="lt">${esc(l.title)}</span><span class="lm">${l.min}m</span><span class="led ${lessonState(l)}" aria-label="${isDone(l.id) ? 'complete' : lessonState(l) === 'part' ? 'started' : 'not started'}"></span></a></li>`).join('')}</ul>
        </details>`;
      }).join('')}</div>
      <div class="foot">
        <div class="move frame rv">
          <h3>Move progress between devices</h3>
          <p>Progress is saved in this browser only. To continue on another device, copy this code there and paste it below on that device.</p>
          <textarea class="codebox" id="myCode" rows="2" readonly aria-label="Your progress code"></textarea>
          <div class="row"><button type="button" class="btn small" id="copyCode">Copy code</button></div>
          <label for="inCode" style="font-size:14px">Paste a code from another device</label>
          <textarea class="codebox" id="inCode" rows="2" placeholder="L2.…"></textarea>
          <div class="row"><button type="button" class="btn small" id="loadCode">Load code</button></div>
        </div>
        ${installHint()}
        <div class="row" id="resetRow"><button type="button" class="btn small ghost" id="resetBtn">Reset my progress</button></div>
      </div>
    </div></div>`;
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
      if (canHover() || peekFor === b) { hidePeek(); go(b.dataset.go); } else showPeek(b, b.dataset.go, true);
    }));
    bindPeek(app);
    $('#myCode').value = makeCode();
    $('#copyCode').addEventListener('click', () => {
      const box = $('#myCode');
      const fallback = () => { box.focus(); box.select(); toast('Code selected: copy it with your keyboard'); };
      try { navigator.clipboard.writeText(box.value).then(() => toast('Progress code copied'), fallback); } catch (_) { fallback(); }
    });
    $('#loadCode').addEventListener('click', () => {
      const v = $('#inCode').value;
      if (!v.trim()) { toast('Paste a code first'); return; }
      try { const n = loadCode(v); toast(n ? `Loaded: ${n} items added` : 'Nothing new in that code'); viewHome(); }
      catch (_) { toast("That code doesn't look right. Copy the whole line starting with L2."); }
    });
    $('#resetBtn').addEventListener('click', () => {
      const row = $('#resetRow');
      row.innerHTML = `<span class="confirm">Erase all lesson, task, quiz and interview progress? <button type="button" class="btn small hot" id="rsYes">Yes, reset</button><button type="button" class="btn small ghost" id="rsNo">Cancel</button></span>`;
      $('#rsYes').addEventListener('click', () => { P = blank(); changed(); toast('Progress reset'); viewHome(); });
      $('#rsNo').addEventListener('click', viewHome);
    });
    afterRender();
  }

  /* ----- lesson ----- */
  const QA = {};
  let justAnswered = null;
  function seededOrder(n, seedStr) {
    let h = 2166136261;
    for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
    const idx = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return idx;
  }
  function viewLesson(id) {
    const l = BYID[id];
    setTab('course'); curLesson = id; termEl = null;
    if (P.last !== id) { P.last = id; changed(); }
    const i = LESSONS.indexOf(l);
    const prev = LESSONS[i - 1], next = LESSONS[i + 1];
    const nt = l.term ? l.term.tasks.length : 0;
    let sn = 0;
    const num = () => String(++sn).padStart(2, '0');
    app.innerHTML = `<div class="page"><div class="col">
      <a class="back" href="#course">← All lessons</a>
      <div class="lhead"><span class="tag">${code(l)}</span>${H1(l.title)}<p class="goal">${l.goal}</p>
        <div class="meta"><span>${l.min} min</span>${nt ? `<span>${nt} terminal tasks</span>` : ''}<span>${l.quiz.length} quiz questions</span></div></div>
      <nav class="jump" aria-label="Lesson sections"><a class="frame" href="#" data-jump="learn">Learn</a>${l.lab ? '<a class="frame" href="#" data-jump="lab">On your Mac</a>' : ''}${nt ? '<a class="frame" href="#" data-jump="term">Terminal</a>' : ''}<a class="frame" href="#" data-jump="quiz">Quiz</a></nav>
      <section class="block" id="s-learn">${LABEL(num(), 'Learn')}<div class="prose">${l.learn}</div></section>
      ${l.lab ? `<section class="block" id="s-lab">${LABEL(num(), 'On your Mac')}<div class="lab frame rv"><div class="prose">${l.lab}</div></div></section>` : ''}
      ${nt ? `<section class="block" id="s-term">${LABEL(num(), 'Practice terminal')}
        <p class="intro">${l.term.intro}</p>
        <div class="taskbar"><span></span><div class="meter" aria-hidden="true"><i style="width:0"></i></div></div>
        <ul class="tasks">${l.term.tasks.map((t, ti) => `<li class="task frame rv" data-i="${ti}"><span class="led" aria-label="Not done yet"></span><span class="tp">${t.p}</span>
          <span class="hint"><button type="button" data-hint="${ti}">Show hint</button></span></li>`).join('')}</ul>
        <div id="termHost"></div></section>` : ''}
      <section class="block" id="s-quiz">${LABEL(num(), 'Quiz')}<div class="quiz" id="quiz"></div></section>
      <section class="block"><div class="done-box frame rv" id="doneBox"></div>
        <div class="pn">${prev ? `<a class="frame" href="#${prev.id}"><span>← ${code(prev)}</span><b>${esc(prev.title)}</b></a>` : '<span></span>'}${next ? `<a class="frame nx" href="#${next.id}"><span>${code(next)} →</span><b>${esc(next.title)}</b></a>` : '<a class="frame nx" href="#interview"><span>Next →</span><b>Interview practice</b></a>'}</div>
      </section>
    </div></div>`;
    app.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const t = $('#s-' + a.dataset.jump); if (t) t.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); }));
    if (nt) {
      l.term.tasks.forEach((_, ti) => paintTask(l, ti, false));
      paintTaskbar(l);
      const moved = M.newSession();
      mountTerminal($('#termHost'), { tall: false });
      pushTX(`<div class="t-sep">── ${esc(code(l))} · ${esc(l.title)} ──</div>` + (moved ? '<span class="t-note">New lesson, new session: you are back in your home folder as tech.</span>' : ''));
      app.querySelectorAll('[data-hint]').forEach(b => b.addEventListener('click', () => {
        const t = l.term.tasks[+b.dataset.hint];
        const first = t.h.split(/, then: /)[0];
        const wrap = b.parentElement;
        wrap.innerHTML = `<code>${esc(t.h)}</code><button type="button" class="paste">Put it in the terminal</button>`;
        $('button', wrap).addEventListener('click', () => setInput(first));
      }));
    }
    renderQuiz(l);
    renderDone(l);
    afterRender();
  }
  function renderQuiz(l) {
    const host = $('#quiz');
    const ans = QA[l.id] || (QA[l.id] = {});
    host.innerHTML = l.quiz.map((q, qi) => {
      const order = seededOrder(q.o.length, l.id + qi + q.q);
      const chosen = ans[qi];
      const just = justAnswered && justAnswered.l === l.id && justAnswered.q === qi;
      return `<div class="q frame rv" data-q="${qi}"><h3><span class="qn">Q${String(qi + 1).padStart(2, '0')}</span>${q.q}</h3><div class="opts">${order.map((oi, pos) => {
        let cls = '';
        if (chosen != null) { if (oi === q.c) cls = ' right'; else if (oi === chosen) cls = ' wrong'; if (just && oi === chosen) cls += ' just'; }
        return `<button type="button" class="opt frame${cls}" data-o="${oi}"${chosen != null ? ' disabled' : ''}><span class="k">${'ABCD'[pos]}</span><span>${q.o[oi]}</span></button>`;
      }).join('')}</div>${chosen != null ? `<p class="why${chosen === q.c ? '' : ' no'}${just ? ' just' : ''}"><b>${chosen === q.c ? 'Correct' : 'Not quite'}</b> ${q.why}</p>` : ''}</div>`;
    }).join('') + scoreHtml(l);
    justAnswered = null;
    host.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      const qi = +b.closest('.q').dataset.q;
      if (ans[qi] != null) return;
      ans[qi] = +b.dataset.o;
      justAnswered = { l: l.id, q: qi };
      if (Object.keys(ans).length === l.quiz.length) {
        const s = l.quiz.filter((q, k) => ans[k] === q.c).length;
        const prevBest = P.quiz[l.id];
        if (!prevBest || s > prevBest.s) { P.quiz[l.id] = { s, t: l.quiz.length }; changed(); }
      }
      const y = window.scrollY;
      renderQuiz(l);
      window.scrollTo(0, y);
      renderDone(l);
    }));
    const retry = $('#retryQuiz', host);
    if (retry) retry.addEventListener('click', () => { QA[l.id] = {}; renderQuiz(l); $('#s-quiz').scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }); });
  }
  function scoreHtml(l) {
    const ans = QA[l.id] || {};
    const n = Object.keys(ans).length;
    const best = P.quiz[l.id];
    if (n < l.quiz.length) return best ? `<p class="best">Best score so far: ${best.s}/${best.t}</p>` : '';
    const s = l.quiz.filter((q, k) => ans[k] === q.c).length;
    const msg = s === l.quiz.length ? 'Full marks.' : s >= l.quiz.length - 1 ? 'Nearly there. Re-read the explanation for the one you missed.' : 'Worth another pass through Learn, then retry.';
    return `<div class="score frame"><strong>${s}/${l.quiz.length}</strong><span>${msg}</span><button type="button" class="btn small" id="retryQuiz">Retry quiz</button></div>`;
  }
  function renderDone(l) {
    const box = $('#doneBox');
    if (!box) return;
    const d = isDone(l.id);
    const nt = l.term ? l.term.tasks.length : 0;
    const td = lessonTasksDone(l);
    const q = P.quiz[l.id];
    box.classList.toggle('is-done', d);
    box.innerHTML = d
      ? `<div class="row"><span class="led done" aria-hidden="true"></span><strong>Lesson complete</strong></div><div class="row"><button type="button" class="btn small ghost" id="undoDone">Mark as not complete</button></div>`
      : `<div>${nt ? `${td} of ${nt} terminal tasks done. ` : ''}${q ? `Quiz best: ${q.s}/${q.t}.` : 'Quiz not finished yet.'}</div><div class="row"><button type="button" class="btn hot" id="markDone">Mark lesson complete</button></div>`;
    const md = $('#markDone'), ud = $('#undoDone');
    if (md) md.addEventListener('click', () => { P.done[l.id] = Date.now(); changed(); renderDone(l); toast(`${code(l)} complete`); });
    if (ud) ud.addEventListener('click', () => { P.done[l.id] = -Date.now(); changed(); renderDone(l); });
  }

  /* ----- full terminal ----- */
  function viewTerminal() {
    setTab('terminal'); curLesson = null; termEl = null;
    app.innerHTML = `<div class="page"><div class="col">
      <p class="eyebrow">Free practice</p>${H1('Practice terminal')}
      <p class="lede">A simulated Ubuntu server, dc-lab-07, with a failing DIMM, a dying disk, a dirty fiber, a GPU off the bus and a full disk. Explore freely. Type <code style="font-family:var(--font-mono);color:var(--cyan)">help</code> for the command list.</p>
    </div><div style="margin-top:20px" id="termHost"></div>
    <div class="col"><div class="foot"><p style="margin:0">It's the same server as in the lessons, so changes carry over until you reset it. Tickets to work on: <code style="font-family:var(--font-mono);color:var(--cyan)">ls tickets</code>.</p></div></div></div>`;
    mountTerminal($('#termHost'), { tall: true });
    afterRender();
  }

  /* ----- interview ----- */
  const IV = { cat: 'All', hide: false, mock: null, open: {} };
  function makeMock() {
    const pick = (cat, n) => ALLQ.filter(q => q.cat === cat).sort(() => Math.random() - 0.5).slice(0, n);
    return [...pick('Linux', 3), ...pick('Hardware', 2), ...pick('Networking', 2), ...pick('Scenarios', 2), ...pick('Behavioural', 1)].map(q => q.k);
  }
  function viewInterview(keepScroll) {
    setTab('interview'); curLesson = null; termEl = null;
    const cats = ['All', ...D.bank.map(c => c.name)];
    const confN = ALLQ.filter(q => isConf(q.k)).length;
    let list = IV.mock ? IV.mock.map(k => ALLQ.find(q => q.k === k)) : ALLQ.filter(q => IV.cat === 'All' || q.cat === IV.cat);
    if (IV.hide) list = list.filter(q => !isConf(q.k));
    app.innerHTML = `<div class="page"${keepScroll ? ' style="animation:none"' : ''}><div class="col">
      <p class="eyebrow" id="ivEyebrow">${ALLQ.length} questions · ${confN} marked ready</p>${H1('Interview practice')}
      <p class="lede">Answer each question out loud first, then reveal the model answer and compare. Tick the ones you can answer confidently.</p>
      <div class="row" style="margin-top:18px"><button type="button" class="btn ${IV.mock ? '' : 'hot'}" id="mockBtn">${IV.mock ? 'Back to all questions' : 'Start a 10-question mock'}</button>
        <label class="conf"><input type="checkbox" id="hideConf"${IV.hide ? ' checked' : ''}> Hide ready ones</label></div>
      ${IV.mock ? '<p class="intro" style="margin-top:16px">Mock: 3 Linux, 2 hardware, 2 networking, 2 scenarios, 1 behavioural. Two minutes per answer, out loud.</p>' : `<div class="chips" role="group" aria-label="Filter by topic">${cats.map(c => `<button type="button" class="chip frame" aria-pressed="${IV.cat === c}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}
      <div class="iq-list">${list.length ? list.map((q, n) => `<article class="iq frame rv${isConf(q.k) ? ' ok' : ''}" data-k="${q.k}">
          <span class="cat">${IV.mock ? `Q${String(n + 1).padStart(2, '0')} · ` : ''}${esc(q.cat)}</span><h3>${q.q}</h3>
          <div class="ans${IV.open[q.k] ? ' open' : ''}" id="ans-${q.k}"${IV.open[q.k] ? '' : ' inert'}><div><div class="prose">${q.a}</div></div></div>
          <div class="iq-foot"><button type="button" class="btn small" data-reveal aria-expanded="${!!IV.open[q.k]}" aria-controls="ans-${q.k}">${IV.open[q.k] ? 'Hide answer' : 'Show answer'}</button>
            <label class="conf"><input type="checkbox" data-conf${isConf(q.k) ? ' checked' : ''}> I can answer this</label></div>
        </article>`).join('') : '<p class="empty">Nothing left here. Every question in this view is marked ready.</p>'}</div>
    </div></div>`;
    $('#mockBtn').addEventListener('click', () => { IV.mock = IV.mock ? null : makeMock(); IV.open = {}; viewInterview(); window.scrollTo(0, 0); });
    $('#hideConf').addEventListener('change', e => { IV.hide = e.target.checked; viewInterview(true); });
    app.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => { IV.cat = b.dataset.cat; viewInterview(true); }));
    app.querySelectorAll('.iq').forEach(card => {
      const k = card.dataset.k;
      const ansEl = $('.ans', card);
      $('[data-reveal]', card).addEventListener('click', e => {
        IV.open[k] = !IV.open[k];
        ansEl.classList.toggle('open', IV.open[k]);
        if (IV.open[k]) ansEl.removeAttribute('inert'); else ansEl.setAttribute('inert', '');
        e.currentTarget.textContent = IV.open[k] ? 'Hide answer' : 'Show answer';
        e.currentTarget.setAttribute('aria-expanded', String(IV.open[k]));
      });
      $('[data-conf]', card).addEventListener('change', e => {
        P.conf[k] = e.target.checked ? Date.now() : -Date.now(); changed();
        card.classList.toggle('ok', e.target.checked);
        $('#ivEyebrow').textContent = `${ALLQ.length} questions · ${ALLQ.filter(q => isConf(q.k)).length} marked ready`;
        if (e.target.checked) toast('Marked ready');
      });
    });
    if (keepScroll) reveal(app); else afterRender();
  }

  /* ================= routing ================= */
  let curView = '';
  function route() {
    $('#toast').hidden = true;
    hidePeek();
    const h = (location.hash || '').slice(1);
    const v = BYID[h] ? 'lesson:' + h : h === 'terminal' ? 'terminal' : h === 'interview' ? 'interview' : 'course';
    if (v === 'terminal') viewTerminal();
    else if (v === 'interview') viewInterview();
    else if (v.startsWith('lesson:')) viewLesson(h);
    else viewHome();
    if (v !== curView) window.scrollTo(0, 0);
    curView = v;
  }
  function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

<script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
