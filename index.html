 * * *<\/code><\/td>\n<td>Every 15 minutes<\/td>\n<\/tr>\n<tr>\n<td><code>0 9 * * 1-5<\/code><\/td>\n<td>09:00 Monday to Friday<\/td>\n<\/tr>\n<tr>\n<td><code>30 2 1 * *<\/code><\/td>\n<td>02:30 on the 1st of every month<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>crontab -l<\/code> lists your jobs, <code>crontab -e<\/code> edits them. The system crontab <code>/etc/crontab<\/code> has an extra <strong>user<\/strong> column. Cron output goes nowhere unless you redirect it: <code>&gt;&gt; /home/tech/health.log 2&gt;&amp;1<\/code>.<\/p>\n<p><strong>systemd timers<\/strong> do the same job with better logging: <code>systemctl list-timers<\/code>.<\/p>\n<h2>How big fleets work<\/h2>\n<p>At the scale of a large cloud provider, people can't watch machines one by one. Typically:<\/p>\n<ol>\n<li><strong>Monitoring and automation<\/strong> detect a problem (like this course's health check, but across the whole fleet).<\/li>\n<li>Automation <strong>drains<\/strong> the machine: moves work off it.<\/li>\n<li>A <strong>repair ticket<\/strong> is created with the evidence and the part to replace.<\/li>\n<li>A <strong>technician<\/strong> confirms the evidence, does the physical work, verifies, and closes the ticket.<\/li>\n<li>Automation runs acceptance tests and puts the machine back into service.<\/li>\n<\/ol>\n<p>Your value as an L2 tech is in steps 4 and 5: precise physical work, solid verification, and spotting when the automation's diagnosis is wrong (for example, the \"bad GPU\" is actually a bad riser, or the \"bad disk\" is a bad cable).<\/p>\n<h2>Working safely<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Safe to run freely<\/th>\n<th>Needs the ticket / approval<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Reading logs, <code>dmesg<\/code>, <code>journalctl<\/code><\/td>\n<td>Restarting or stopping services<\/td>\n<\/tr>\n<tr>\n<td><code>smartctl<\/code>, <code>ipmitool sel list<\/code>, sensors<\/td>\n<td>Power off / cycle<\/td>\n<\/tr>\n<tr>\n<td><code>ip<\/code>, <code>ethtool<\/code>, <code>lldpctl<\/code>, <code>ping<\/code><\/td>\n<td>Changing network config, taking links down<\/td>\n<\/tr>\n<tr>\n<td><code>lspci<\/code>, <code>dmidecode<\/code>, <code>lsblk<\/code><\/td>\n<td>Wiping, formatting, partitioning<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Your detailed ticket documentation from L1 is a real strength here. Say so in the interview.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>crontab -l\n(crontab -l 2&gt;/dev/null; echo &quot;*/5 * * * * /home/ubuntu/check.sh &gt;&gt; /home/ubuntu/check.log 2&gt;&amp;1&quot;) | crontab -\ncrontab -l\nsystemctl list-timers\n<\/code><\/pre>\n<p>Wait 5–10 minutes, then <code>cat ~/check.log<\/code>. Remove the job afterwards with <code>crontab -e<\/code> (or <code>crontab -r<\/code> to remove all).<\/p>", "term": {"intro": "See what's scheduled on dc-lab-07.", "tasks": [{"p": "List your own cron jobs", "c": {"t": "re", "v": "^crontab\\s+-l$"}, "h": "crontab -l"}, {"p": "Read the system crontab", "c": {"t": "re", "v": "^cat\\s+/etc/crontab$"}, "h": "cat /etc/crontab"}, {"p": "List systemd timers", "c": {"t": "re", "v": "^systemctl\\s+list-timers$"}, "h": "systemctl list-timers"}]}, "quiz": [{"q": "What does <code>*/15 * * * *<\/code> mean?", "o": ["Every 15 minutes", "At 15 minutes past every hour", "On the 15th of every month"], "c": 0, "why": "*/15 in the minute field = every 15 minutes."}, {"q": "<code>0 3 * * 1-5<\/code> runs when?", "o": ["03:00 every day", "03:00 Monday to Friday", "01:00 to 05:00 every 3 hours"], "c": 1, "why": "Day-of-week 1-5 = Monday to Friday."}, {"q": "In an automated fleet, what's a key value a technician adds?", "o": ["Writing all the automation", "Accurate physical repairs, solid verification, and catching wrong automated diagnoses", "Watching dashboards all day"], "c": 1, "why": "Automation finds problems; people fix and verify the physical world."}, {"q": "Which of these needs a ticket or approval rather than just running it?", "o": ["sudo ipmitool sel list", "ethtool -S ens1f0", "sudo ipmitool chassis power cycle"], "c": 2, "why": "Read-only commands are low risk. Power control changes state."}]}]}, {"n": 9, "title": "Troubleshooting scenarios", "summary": "A repeatable troubleshooting method, then four full incidents on dc-lab-07: memory, disk full and RAID, a flapping link, and a lost GPU.", "lessons": [{"id": "w9d1", "title": "The troubleshooting method", "min": 25, "goal": "Have one method you can apply to any fault and explain out loud in an interview.", "learn": "<p>Interviewers care less about whether you know the answer and more about <strong>how you get there<\/strong>. Use the same steps every time.<\/p>\n<h2>The seven steps<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Step<\/th>\n<th>What you do<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. <strong>Confirm<\/strong><\/td>\n<td>Read the ticket. Confirm hostname, rack/U, asset tag, serial. Blink the locate LED<\/td>\n<td>\"dc-lab-07, A12 U21, asset 000731, LED on\"<\/td>\n<\/tr>\n<tr>\n<td>2. <strong>Gather<\/strong><\/td>\n<td>Collect evidence without changing anything: OS logs, BMC SEL, monitoring<\/td>\n<td><code>dmesg<\/code>, <code>journalctl<\/code>, <code>ipmitool sel list<\/code><\/td>\n<\/tr>\n<tr>\n<td>3. <strong>Hypothesise<\/strong><\/td>\n<td>What's the most likely cause given the evidence?<\/td>\n<td>\"One GPU dropped off the PCIe bus\"<\/td>\n<\/tr>\n<tr>\n<td>4. <strong>Test one change<\/strong><\/td>\n<td>Change one thing only, so you know what fixed it<\/td>\n<td>Reseat, not reseat + new cable + new optic<\/td>\n<\/tr>\n<tr>\n<td>5. <strong>Verify<\/strong><\/td>\n<td>Re-run the same checks that showed the problem<\/td>\n<td>Counters stopped, part detected, errors gone<\/td>\n<\/tr>\n<tr>\n<td>6. <strong>Document<\/strong><\/td>\n<td>What you found, what you changed, serials, before/after<\/td>\n<td>Ticket notes<\/td>\n<\/tr>\n<tr>\n<td>7. <strong>Escalate with evidence<\/strong><\/td>\n<td>When it's outside your scope or a fix didn't work<\/td>\n<td>Attach logs and what you already tried<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Habits that make you look senior<\/h2>\n<ul>\n<li><strong>Known-good swap:<\/strong> prove a part is bad by swapping in one you know works, and see if the problem moves.<\/li>\n<li><strong>Does it follow the part or the location?<\/strong> Move the suspect to another slot. If the error follows the part, it's the part. If it stays, it's the slot, cable, or board.<\/li>\n<li><strong>Symptom vs cause:<\/strong> fabric manager failing is a symptom; the missing GPU is the cause.<\/li>\n<li><strong>Read-only first:<\/strong> gather evidence before you touch anything that changes state.<\/li>\n<li><strong>Time-box:<\/strong> if you're 30 minutes in without progress, escalate with what you have.<\/li>\n<\/ul>\n<h2>A ticket note template<\/h2>\n<pre><code>Checked:   dc-lab-07 A12/U21 asset DC-ASSET-000731, locate LED confirmed\nEvidence:  rasdaemon 89 CE on P2-DIMMC1; SEL &quot;Correctable ECC logging\n           limit reached&quot; P2-DIMMC1 at 10/21 07:13\nAction:    Host drained (confirmed). Replaced P2-DIMMC1.\n           Old SN 9B3E1A47 -&gt; new SN 5C21F0D8\nVerify:    32 x 64 GB detected, new SN in dmidecode, memtest passed,\n           0 new CE after 2 h\nStatus:    Returned to service\n<\/code><\/pre>\n<p>(Serial numbers above are examples.) A note like this lets anyone pick up the work, and it's exactly the documentation habit you already have from L1.<\/p>", "lab": "<p>Write your own ticket note template in your phone's Notes app based on the one above. Then take one real fault you handled at L1 and rewrite it in this format, leaving out anything confidential. You'll reuse it for behavioural answers in week 10.<\/p>", "term": {"intro": "Practise steps 1 and 2 on ticket TKT-4414 (the GPU). Gather evidence only, change nothing.", "tasks": [{"p": "List the open tickets", "c": {"t": "re", "v": "^ls(\\s+-\\w+)*\\s+(~/|/home/tech/)?tickets/?$"}, "h": "ls tickets"}, {"p": "Read TKT-4414", "c": {"t": "re", "v": "^(cat|less)\\s+(~/|/home/tech/)?tickets/TKT-4414\\.txt$"}, "h": "cat tickets/TKT-4414.txt"}, {"p": "Confirm the host identity and serial", "c": {"t": "re", "v": "^(hostname|sudo\\s+dmidecode\\s+-s\\s+system-serial-number)$"}, "h": "sudo dmidecode -s system-serial-number"}, {"p": "Evidence 1: what the PCIe bus shows", "c": {"t": "re", "v": "^lspci\\s*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?(nvidia|NVIDIA|3D)"}, "h": "lspci | grep -i nvidia"}, {"p": "Evidence 2: what the kernel logged", "c": {"t": "re", "v": "^sudo\\s+dmesg.*\\|\\s*grep\\s+.*(xid|Xid|XID)"}, "h": "sudo dmesg -T | grep -i xid"}, {"p": "Evidence 3: what the BMC logged", "c": {"t": "re", "v": "^sudo\\s+ipmitool\\s+sel\\s+e?list(\\s*\\|.*)?$"}, "h": "sudo ipmitool sel list"}]}, "quiz": [{"q": "Why change only one thing at a time?", "o": ["So you know which change fixed (or didn't fix) the problem", "To make the repair take longer", "Because tools only allow one change"], "c": 0, "why": "Multiple simultaneous changes hide the real cause."}, {"q": "You move a suspect DIMM to another slot and the errors move with it. Conclusion?", "o": ["The DIMM is faulty", "The slot is faulty", "The CPU is faulty"], "c": 0, "why": "The fault followed the part."}, {"q": "Fabric manager is failed and one GPU is missing. Which is the cause?", "o": ["Fabric manager", "The missing GPU", "Both independently"], "c": 1, "why": "The service depends on all GPUs. Fix the GPU."}, {"q": "You've spent 30 minutes without progress on a P1 ticket. Best move?", "o": ["Keep trying random fixes", "Escalate with the evidence and what you've already tried", "Reboot and close the ticket"], "c": 1, "why": "Escalating with evidence is professional, not weak."}]}, {"id": "w9d2", "title": "Scenario: memory errors on a live host", "min": 30, "goal": "Work TKT-4411 end to end: confirm the DIMM from two sources, get its serial, and describe the physical repair and verification.", "learn": "<h2>The ticket<\/h2>\n<p>Monitoring says P2-DIMMC1 on dc-lab-07 has climbing corrected errors. The BMC logged \"Correctable ECC logging limit reached\".<\/p>\n<h2>Step by step<\/h2>\n<p><strong>1. Confirm the host<\/strong> (<code>hostname<\/code>, asset tag, locate LED).<\/p>\n<p><strong>2. Evidence from the OS:<\/strong><\/p>\n<pre><code>sudo ras-mc-ctl --summary         # errors per DIMM label\nsudo ras-mc-ctl --errors | tail   # when they happened\nsudo dmesg -T | grep -i edac | tail -n 3\n<\/code><\/pre>\n<p>You see a <strong>rising<\/strong> count: 1, 3, 7, 12, 25, 41 over about a week. That trend is what justifies a replacement.<\/p>\n<p><strong>3. Evidence from the BMC:<\/strong><\/p>\n<pre><code>sudo ipmitool sel list | grep -i ecc\n<\/code><\/pre>\n<p>OS (rasdaemon label) and BMC (SEL slot name) both say <strong>P2-DIMMC1<\/strong>. Two independent sources agree, so you can be confident.<\/p>\n<p><strong>4. Record the current DIMM:<\/strong><\/p>\n<pre><code>sudo dmidecode -t memory | grep -A 6 &quot;Locator: P2-DIMMC1&quot;\n<\/code><\/pre>\n<p>Write down the serial and part number.<\/p>\n<p><strong>5. Physical repair<\/strong> (per site procedure):<\/p>\n<ul>\n<li>Host drained? Confirm in the tool or with the owning team.<\/li>\n<li>Shut down through the approved method, remove power cords, ESD strap.<\/li>\n<li>Find P2-DIMMC1 with the board map (lid label or service guide). Double-check: P2 = second CPU, channel C, slot 1.<\/li>\n<li>Swap with the same part number. Check both latches and that it sits evenly.<\/li>\n<\/ul>\n<p><strong>6. Verify:<\/strong><\/p>\n<ul>\n<li>Power on and watch POST via the BMC console for memory training errors.<\/li>\n<li><code>free -h<\/code> shows the full 2 TiB; <code>dmidecode<\/code> shows 32 × 64 GB and the <strong>new serial<\/strong> in P2-DIMMC1.<\/li>\n<li>Run the memory test your procedure requires.<\/li>\n<li>Over the next hours, error counts for P2-DIMMC1 stay flat.<\/li>\n<\/ul>\n<p><strong>7. Document<\/strong> old and new serials, evidence, test result. RMA the old DIMM.<\/p>\n<h2>If the errors come back<\/h2>\n<p>New DIMM, same slot, same errors? The fault stayed with the <strong>location<\/strong>: motherboard slot, CPU socket (bent pins) or the CPU's memory controller. Escalate with: \"errors persisted on P2-DIMMC1 after replacing the DIMM (old SN, new SN), evidence attached.\"<\/p>", "lab": "<p>Answer out loud, timing yourself (aim for 2 minutes): \"A server has rising corrected memory errors on one DIMM. Walk me through what you'd do.\" Record yourself on your phone and listen back. Did you mention confirming the host, two sources of evidence, draining, ESD, serials, and verification?<\/p>", "term": {"intro": "Work TKT-4411 on dc-lab-07.", "tasks": [{"p": "Read the ticket", "c": {"t": "re", "v": "^(cat|less)\\s+(~/|/home/tech/)?tickets/TKT-4411\\.txt$"}, "h": "cat tickets/TKT-4411.txt"}, {"p": "Get the per-DIMM error summary", "c": {"t": "re", "v": "^sudo\\s+ras-mc-ctl\\s+--summary$"}, "h": "sudo ras-mc-ctl --summary"}, {"p": "See the trend over time", "c": {"t": "re", "v": "^sudo\\s+ras-mc-ctl\\s+--errors(\\s*\\|.*)?$"}, "h": "sudo ras-mc-ctl --errors"}, {"p": "Confirm the slot from the BMC", "c": {"t": "re", "v": "^sudo\\s+ipmitool\\s+sel\\s+e?list\\s*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?(ecc|ECC|P2-DIMMC1)"}, "h": "sudo ipmitool sel list | grep -i ecc"}, {"p": "Record the current DIMM's serial number", "c": {"t": "re", "v": "^sudo\\s+dmidecode\\s+-t\\s+(memory|17)\\s*\\|\\s*grep\\s+.*P2-DIMMC1"}, "h": "sudo dmidecode -t memory | grep -A 6 \"Locator: P2-DIMMC1\""}, {"p": "Confirm the total memory you'll check again after the swap", "c": {"t": "re", "v": "^free\\s+-h$"}, "h": "free -h"}]}, "quiz": [{"q": "Why check both rasdaemon and the BMC SEL?", "o": ["Two independent sources agreeing on the slot gives confidence before pulling a part", "The BMC is always right and rasdaemon is always wrong", "It's required by Linux"], "c": 0, "why": "Cross-checking prevents pulling the wrong DIMM."}, {"q": "What makes the case for replacing a DIMM with only corrected errors?", "o": ["Any single corrected error", "A steadily rising count on the same DIMM", "A reboot"], "c": 1, "why": "The trend predicts failure."}, {"q": "After the swap, how do you prove the new DIMM is installed and seen?", "o": ["dmidecode shows the new serial in P2-DIMMC1 and the total memory is correct", "The server boots", "uptime is low"], "c": 0, "why": "Booting isn't proof. The serial and the count are."}, {"q": "Same errors on P2-DIMMC1 after the swap. What next?", "o": ["Order another DIMM and try again", "Escalate: the fault stayed with the slot, so suspect board, socket or CPU, with evidence", "Clear the logs"], "c": 1, "why": "The location, not the DIMM, is the common factor."}]}, {"id": "w9d3", "title": "Scenario: disk full and a failing RAID member", "min": 30, "goal": "Free space safely on a full filesystem, then replace a failed RAID member without losing data.", "learn": "<h2>Part 1: TKT-4416, root filesystem 96% full<\/h2>\n<p><strong>Find what's using the space, top down:<\/strong><\/p>\n<pre><code>df -h /\nsudo du -sh /var/* 2&gt;/dev/null | sort -h | tail\nsudo du -sh /var/log/* | sort -h | tail\n<\/code><\/pre>\n<p><code>/var/log/collector-debug.log<\/code> is <strong>1.3 TB<\/strong>: a service left in debug mode.<\/p>\n<p><strong>The trap: deleted but still open.<\/strong> <code>df<\/code> and <code>du<\/code> can disagree when a process still holds a file that was deleted. The name is gone, but the space isn't freed until the process closes it:<\/p>\n<pre><code>sudo lsof +L1\ncollector 48211 root 4w REG ... /var/log/collector-debug.log.1 (deleted)\n<\/code><\/pre>\n<p><strong>Safe fix (with the owning team's OK):<\/strong><\/p>\n<ol>\n<li><strong>Truncate<\/strong> instead of delete: <code>sudo truncate -s 0 /var/log/collector-debug.log<\/code>. The file stays, the process keeps writing, the space comes back immediately.<\/li>\n<li>Restart the service so it releases the deleted file: <code>sudo systemctl restart collector<\/code>.<\/li>\n<li>Verify with <code>df -h /<\/code>.<\/li>\n<li>Root cause goes back to the owner: turn off debug logging, add log rotation.<\/li>\n<\/ol>\n<p>If you had used <code>rm<\/code> on the open log, <code>df<\/code> would still show it full. That's the trap.<\/p>\n<p>Also check <strong>inodes<\/strong> (<code>df -i<\/code>): a filesystem can be \"full\" with free space if millions of tiny files used every inode.<\/p>\n<h2>Part 2: TKT-4413, md0 degraded, sdb faulty<\/h2>\n<p><strong>Confirm the disk three ways:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Source<\/th>\n<th>Command<\/th>\n<th>Shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kernel<\/td>\n<td><code>sudo dmesg -T | grep sdb<\/code><\/td>\n<td>I/O errors, md kicked sdb2 out<\/td>\n<\/tr>\n<tr>\n<td>RAID<\/td>\n<td><code>cat /proc/mdstat<\/code>, <code>sudo mdadm --detail /dev/md0<\/code><\/td>\n<td><code>[U_]<\/code>, sdb2 faulty<\/td>\n<\/tr>\n<tr>\n<td>SMART<\/td>\n<td><code>sudo smartctl -A /dev/sdb<\/code><\/td>\n<td>Reallocated 312, pending 24<\/td>\n<\/tr>\n<tr>\n<td>BMC<\/td>\n<td><code>sudo ipmitool sel list<\/code><\/td>\n<td>Drive Fault on <strong>Disk1<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Map the name to hardware: <code>lsblk -o NAME,SERIAL<\/code> gives sdb's serial <strong>ZBS1J9W2<\/strong>. The BMC says <strong>Disk1<\/strong>. Confirm the serial on the drive label in that bay before pulling.<\/p>\n<p><strong>Replace:<\/strong><\/p>\n<pre><code>sudo mdadm --manage /dev/md0 --remove /dev/sdb2\n# swap the physical disk in bay Disk1 (serial ZBS1J9W2 out)\nsudo sfdisk -d /dev/sda | sudo sfdisk /dev/sdb    # copy partition layout\nsudo mdadm --manage /dev/md0 --add /dev/sdb2\ncat /proc/mdstat                                  # watch recovery\n<\/code><\/pre>\n<p>On a boot mirror, the procedure also installs the bootloader on the new disk so the server can boot from either.<\/p>\n<p><strong>Never<\/strong> pull sda here: it holds the only working copy.<\/p>", "lab": "<p>In your VM, create the deleted-but-open trap yourself:<\/p>\n<pre><code>dd if=/dev/zero of=~/big.log bs=1M count=500\ndf -h /\ntail -f ~/big.log &amp;\nrm ~/big.log\ndf -h /            # space NOT freed\nsudo lsof +L1\nkill %1\ndf -h /            # now it's freed\n<\/code><\/pre>", "term": {"intro": "Fix TKT-4416 (disk full), then start TKT-4413 (RAID).", "tasks": [{"p": "Check how full / is", "c": {"t": "re", "v": "^df\\s+-h(\\s+/)?$"}, "h": "df -h /"}, {"p": "Find the biggest things in /var/log", "c": {"t": "re", "v": "^sudo\\s+du\\s+-\\w*s\\w*\\s+/var/log/\\*(\\s*\\|.*)?$"}, "h": "sudo du -sh /var/log/* | sort -h"}, {"p": "Look for deleted files still held open", "c": {"t": "re", "v": "^sudo\\s+lsof\\s+\\+L1$"}, "h": "sudo lsof +L1"}, {"p": "Empty the debug log safely without deleting it", "c": {"t": "flag", "v": "log=true"}, "h": "sudo truncate -s 0 /var/log/collector-debug.log"}, {"p": "Restart collector so it lets go of the deleted file", "c": {"t": "flag", "v": "deleted=true"}, "h": "sudo systemctl restart collector"}, {"p": "Verify the space came back", "c": {"t": "re", "v": "^df\\s+-h(\\s+/)?$"}, "h": "df -h /"}, {"p": "Remove the faulty member from md0", "c": {"t": "flag", "v": "raid=removed|rebuilding"}, "h": "sudo mdadm --manage /dev/md0 --remove /dev/sdb2"}, {"p": "After the (simulated) disk swap, add the new member back", "c": {"t": "flag", "v": "raid=rebuilding"}, "h": "sudo mdadm --manage /dev/md0 --add /dev/sdb2"}, {"p": "Watch the rebuild", "c": {"t": "re", "v": "^cat\\s+/proc/mdstat$"}, "h": "cat /proc/mdstat"}]}, "quiz": [{"q": "You deleted a 100 GB log, but df still shows the disk full. Most likely reason?", "o": ["A process still has the deleted file open", "df is cached until reboot", "The file moved to a recycle bin"], "c": 0, "why": "Space is freed only when the last open handle closes. Check lsof +L1."}, {"q": "Why truncate a log instead of deleting it?", "o": ["The space is freed immediately even while a process keeps writing to it", "Truncating is required by systemd", "Deleting logs is illegal"], "c": 0, "why": "truncate -s 0 empties the file in place."}, {"q": "<code>df -h<\/code> shows 40% used, but writes fail with \"No space left on device\". What do you check?", "o": ["free -h", "df -i, for inode exhaustion", "lsblk"], "c": 1, "why": "Millions of tiny files can use up every inode."}, {"q": "Before pulling the failed disk from a degraded RAID 1, what do you confirm?", "o": ["The bay's drive serial matches the failed member's serial", "That the server is pingable", "That the healthy disk is unplugged first"], "c": 0, "why": "Serial + slot + BMC fault LED, then pull."}]}, {"id": "w9d4", "title": "Scenario: a flapping 100G link", "min": 30, "goal": "Work TKT-4412 with the network team: gather the right evidence, fix it one change at a time, and prove it's fixed.", "learn": "<h2>The ticket<\/h2>\n<p>ens1f0 keeps dropping and CRC errors are rising. Peer: leaf-a12 Ethernet1/17.<\/p>\n<h2>Gather<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>Command<\/th>\n<th>dc-lab-07 says<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>How often does it drop?<\/td>\n<td><code>sudo dmesg -T | grep ens1f0<\/code><\/td>\n<td>7 down/up pairs over two weeks, last one today 08:00<\/td>\n<\/tr>\n<tr>\n<td>How bad are the errors?<\/td>\n<td><code>ethtool -S ens1f0 | grep -iE \"crc|symbol|link_down\"<\/code><\/td>\n<td>18 342 CRC, 7 link-down events<\/td>\n<\/tr>\n<tr>\n<td>Which lane?<\/td>\n<td><code>ethtool -S ens1f0 | grep lane<\/code><\/td>\n<td>lane 2: 1.8 million errors, others near zero<\/td>\n<\/tr>\n<tr>\n<td>Is the light OK?<\/td>\n<td><code>sudo ethtool -m ens1f0 | grep -i rcvr<\/code><\/td>\n<td>Channel 3 at −12 dBm, others about −1.4 dBm<\/td>\n<\/tr>\n<tr>\n<td>Which far end?<\/td>\n<td><code>lldpctl ens1f0<\/code><\/td>\n<td>leaf-a12, Ethernet1/17<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>One lane far weaker than the other three, and errors on that same lane (channel 3 = lane 2), point at <strong>one fiber in the MPO path<\/strong>: dirt on the connector, a damaged fiber, or one bad lane in an optic.<\/p>\n<h2>Fix, one change at a time<\/h2>\n<p>Agree the plan with the network team (they watch the switch side):<\/p>\n<ol>\n<li><strong>Inspect and clean<\/strong> both MPO ends and both optic ports. Re-inspect. Reconnect. Re-check RX power.<\/li>\n<li>If still low: <strong>reseat<\/strong> the optics.<\/li>\n<li>If still low: <strong>swap the cable<\/strong> for a known-good one.<\/li>\n<li>If still low: <strong>swap the optic<\/strong>, local first, then the far end.<\/li>\n<li>If still low: the network team moves it to another <strong>switch port<\/strong>.<\/li>\n<\/ol>\n<p>After <strong>each<\/strong> step, record RX power per lane and counter values with timestamps.<\/p>\n<h2>Verify<\/h2>\n<ul>\n<li>All four lanes within spec and close to each other.<\/li>\n<li><code>rx_crc_errors_phy<\/code> and <code>link_down_events_phy<\/code> <strong>stop increasing<\/strong> over a soak period your procedure defines.<\/li>\n<li>No new Link down in <code>dmesg<\/code>.<\/li>\n<li>The network team confirms the switch side is clean too.<\/li>\n<\/ul>\n<p>Use <code>sudo ethtool -p ens1f0 10<\/code> to blink the port LED so you're sure which cable you're handling.<\/p>", "lab": "<p>Write the ticket note for this scenario using the template from w9d1, assuming cleaning the MPO on the server end fixed it (lane 3 back to −1.4 dBm, no new errors in 2 hours). Keep it under 10 lines.<\/p>", "term": {"intro": "Gather the evidence for TKT-4412.", "tasks": [{"p": "Read the ticket", "c": {"t": "re", "v": "^(cat|less)\\s+(~/|/home/tech/)?tickets/TKT-4412\\.txt$"}, "h": "cat tickets/TKT-4412.txt"}, {"p": "When did the link drop?", "c": {"t": "re", "v": "^sudo\\s+dmesg.*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?ens1f0"}, "h": "sudo dmesg -T | grep ens1f0 | tail -n 4"}, {"p": "Error and link-down counters", "c": {"t": "re", "v": "^ethtool\\s+-S\\s+ens1f0\\s*\\|\\s*grep"}, "h": "ethtool -S ens1f0 | grep -iE \"crc|symbol|link_down\""}, {"p": "Per-lane errors", "c": {"t": "re", "v": "^ethtool\\s+-S\\s+ens1f0\\s*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?lane"}, "h": "ethtool -S ens1f0 | grep lane"}, {"p": "Per-lane receive light", "c": {"t": "re", "v": "^sudo\\s+ethtool\\s+-m\\s+ens1f0\\s*\\|\\s*grep\\s+.*(rcvr|Rcvr)"}, "h": "sudo ethtool -m ens1f0 | grep -i rcvr"}, {"p": "Who is on the other end?", "c": {"t": "re", "v": "^(sudo\\s+)?lldpctl(\\s+ens1f0)?$"}, "h": "lldpctl ens1f0"}, {"p": "Blink the port so you handle the right cable", "c": {"t": "re", "v": "^sudo\\s+ethtool\\s+-p\\s+ens1f0(\\s+\\d+)?$"}, "h": "sudo ethtool -p ens1f0 10"}]}, "quiz": [{"q": "Three lanes at −1.4 dBm and one at −12 dBm. Most likely cause?", "o": ["A problem on that one fiber path: dirt or damage on the MPO, or one bad lane", "The whole optic is dead", "The switch has the wrong VLAN"], "c": 0, "why": "One lane out of four points at a single fiber."}, {"q": "Why record counters and light levels after every step?", "o": ["To prove which change fixed it and to show the fix holds", "Because counters reset after each step", "To fill the ticket"], "c": 0, "why": "Before/after evidence per change."}, {"q": "What's the first physical step for a dirty-looking optical link?", "o": ["Replace the optic", "Inspect, clean, re-inspect both ends", "Replace the switch"], "c": 1, "why": "Cleaning is cheap and fixes most fiber issues."}, {"q": "What proves the fix?", "o": ["The link is up right now", "All lanes in spec and error counters stop increasing over a soak period", "The ticket is closed"], "c": 1, "why": "A flapping link is also up most of the time. You need a stable trend."}]}, {"id": "w9d5", "title": "Scenario: a GPU off the bus, and a host that won't come back", "min": 30, "goal": "Collect a complete evidence bundle for a GPU failure, and troubleshoot a server that doesn't return after a reboot.", "learn": "<h2>Part 1: TKT-4414, GPU off the bus<\/h2>\n<p><strong>Evidence on dc-lab-07:<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Source<\/th>\n<th>Finding<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>sudo dmesg -T | grep -i xid<\/code><\/td>\n<td>Xid 79 on PCI 0000:9a:00, \"GPU has fallen off the bus\"<\/td>\n<\/tr>\n<tr>\n<td><code>sudo dmesg -T | grep -i aer<\/code><\/td>\n<td>PCIe AER uncorrected fatal error from 9a:00.0<\/td>\n<\/tr>\n<tr>\n<td><code>lspci | grep -i nvidia<\/code><\/td>\n<td>9a:00.0 shows <strong>rev ff<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>nvidia-smi<\/code><\/td>\n<td>Can't get a handle for 9A:00.0; only 7 GPUs listed, and indexes shifted<\/td>\n<\/tr>\n<tr>\n<td><code>systemctl status nvidia-fabricmanager<\/code><\/td>\n<td>Failed: \"expected 8, found 7\" (symptom)<\/td>\n<\/tr>\n<tr>\n<td><code>sudo ipmitool sel list<\/code><\/td>\n<td>Critical Interrupt on PCIe_GPU4<\/td>\n<\/tr>\n<tr>\n<td><code>sudo dmesg -T | grep NVRM<\/code><\/td>\n<td>The driver also logs the lost GPU's UUID and board serial (1654023045127)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Next steps<\/strong> (vendor procedure decides the details):<\/p>\n<ol>\n<li>Escalate with the bundle: the lines above plus the vendor bug-report tool output.<\/li>\n<li>With the host drained: reboot or power-cycle as instructed.<\/li>\n<li>If the GPU returns: run diagnostics (NVIDIA DCGM, e.g. <code>dcgmi diag -r 3<\/code>) and check its PCIe link width.<\/li>\n<li>If it fails again or doesn't return: reseat or replace per procedure, check power cables to the GPU baseboard and thermal contact.<\/li>\n<li>Verify: 8 GPUs, all links at full width and speed, fabric manager running, diagnostics pass.<\/li>\n<\/ol>\n<h2>Part 2: \"I rebooted it and it didn't come back\"<\/h2>\n<p>Work from the outside in, using the BMC:<\/p>\n<ol>\n<li><code>ipmitool chassis power status<\/code> and <code>chassis status<\/code>: is it on? Any faults?<\/li>\n<li><code>ipmitool sel list<\/code>: new events since the reboot? Memory, CPU, PCIe?<\/li>\n<li><code>ipmitool sol activate<\/code>: watch the console. Where does it stop? POST, PXE, GRUB, kernel panic, emergency mode?<\/li>\n<li>Match the stage to the cause (week 4, lesson 5).<\/li>\n<\/ol>\n<h2>The extra finding<\/h2>\n<p>While gathering evidence you'd also see this in the SEL: <strong>PSU2 \"AC lost\" and \"Redundancy Lost\"<\/strong> since 10/14. It's not in any ticket. The server runs on one power supply. Report it as a separate issue (check PSU2's cord and its PDU/circuit). Spotting problems nobody asked about is a big part of being a good L2 tech.<\/p>", "lab": "<p>Answer out loud in 2 minutes: \"A GPU node shows only 7 of 8 GPUs. What do you do?\" Then: \"After a reboot the server doesn't come back. Where do you start?\" Record and compare with the steps above.<\/p>", "term": {"intro": "Build the evidence bundle for TKT-4414 and spot the extra finding.", "tasks": [{"p": "Show the GPU table and its error", "c": {"t": "re", "v": "^nvidia-smi$"}, "h": "nvidia-smi"}, {"p": "Find the device that stopped answering", "c": {"t": "re", "v": "^lspci\\s*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?(rev ff|ff\\))"}, "h": "lspci | grep \"rev ff\""}, {"p": "Get the Xid and AER lines together", "c": {"t": "re", "v": "^sudo\\s+dmesg.*\\|\\s*grep\\s+-\\w*E\\w*\\s+.*(xid|Xid).*(aer|AER)|^sudo\\s+dmesg.*\\|\\s*grep\\s+-\\w*E\\w*\\s+.*(aer|AER).*(xid|Xid)"}, "h": "sudo dmesg -T | grep -iE \"xid|aer\""}, {"p": "Read the last BMC events", "c": {"t": "re", "v": "^sudo\\s+ipmitool\\s+sel\\s+e?list(\\s*\\|.*)?$"}, "h": "sudo ipmitool sel list | tail -n 4"}, {"p": "Check the power supplies from the BMC", "c": {"t": "re", "v": "^sudo\\s+ipmitool\\s+(sdr|sensor)(\\s+\\w+)?\\s*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?(psu|PSU)"}, "h": "sudo ipmitool sdr | grep -i psu"}, {"p": "Open the serial console (what you'd watch during a reboot)", "c": {"t": "re", "v": "^sudo\\s+ipmitool\\s+sol\\s+activate$"}, "h": "sudo ipmitool sol activate"}]}, "quiz": [{"q": "Which three findings together show a GPU fell off the bus?", "o": ["Xid 79 in dmesg, rev ff in lspci, nvidia-smi unable to get a handle for that bus ID", "High temperature, high power, high utilisation", "Fabric manager failed, ssh active, disk full"], "c": 0, "why": "Driver, bus and tool all agree."}, {"q": "A server doesn't come back after a reboot. What's your first source of information?", "o": ["SSH", "The BMC: power status, SEL, Serial over LAN console", "The ticket history"], "c": 1, "why": "If the OS isn't up, only the BMC can tell you where it stopped."}, {"q": "While working a GPU ticket you notice \"PSU2 AC lost\" in the SEL. What do you do?", "o": ["Ignore it, it's not your ticket", "Report it as a separate issue", "Clear the SEL so the ticket looks clean"], "c": 1, "why": "Unrelated findings get their own ticket. Never hide evidence."}, {"q": "Why does the evidence bundle include the GPU's bus ID and board serial, not \"GPU 4\"?", "o": ["Indexes can shift; bus ID and serial identify the physical card", "Serials are shorter", "nvidia-smi requires it"], "c": 0, "why": "Physical identity matters for RMA and for pulling the right card."}]}]}, {"n": 10, "title": "Interview ready", "summary": "How the technical round works, rapid-fire drills, your behavioural stories, a final mock, and getting back in touch with the recruiter.", "lessons": [{"id": "w10d1", "title": "How the technical interview works", "min": 20, "goal": "Know what the interviewer is scoring and how to structure any technical answer.", "learn": "<h2>The process<\/h2>\n<p>Your recruiter said: learn more Linux, then the technical round. Exact steps vary by role and location, so <strong>ask your recruiter<\/strong> what the technical round covers and how many interviews there are. Typically for datacenter technician roles you can expect:<\/p>\n<ul>\n<li>technical questions on <strong>Linux, server hardware, networking and troubleshooting<\/strong>, often as scenarios (\"a server won't boot, what do you do?\"),<\/li>\n<li><strong>behavioural<\/strong> questions about how you work with others, handle mistakes and learn.<\/li>\n<\/ul>\n<p>Google has publicly described assessing four things: <strong>general cognitive ability<\/strong> (how you think through problems), <strong>leadership<\/strong>, <strong>role-related knowledge<\/strong>, and <strong>\"Googleyness\"<\/strong> (things like comfort with ambiguity, collaboration and doing the right thing).<\/p>\n<h2>How to answer a technical scenario<\/h2>\n<ol>\n<li><strong>Clarify.<\/strong> \"Is the server in production? Do I have OS access or only the BMC?\" Good questions score points.<\/li>\n<li><strong>Say your method out loud.<\/strong> Confirm the host → gather evidence → hypothesise → one change → verify → document.<\/li>\n<li><strong>Name real commands and what you'd look for.<\/strong> \"<code>sudo smartctl -A /dev/sdb<\/code>, I'd check reallocated and pending sectors, and whether the kernel logged I/O errors.\"<\/li>\n<li><strong>Mention safety and procedure.<\/strong> Drained host, ESD, approved power actions, data handling.<\/li>\n<li><strong>Say how you'd verify<\/strong> the fix.<\/li>\n<li><strong>If you don't know:<\/strong> say how you'd find out (\"I'd check the man page / runbook / ask the senior tech, and I'd collect X first\"). Never bluff.<\/li>\n<\/ol>\n<h2>Weak vs strong<\/h2>\n<p><strong>Weak:<\/strong> \"I'd replace the disk.\"<\/p>\n<p><strong>Strong:<\/strong> \"First I'd confirm it's the right server and disk: hostname, asset tag, and the serial of sdb against the BMC's drive-fault slot. I'd check <code>/proc/mdstat<\/code> to see the array state, <code>dmesg<\/code> for I/O errors and <code>smartctl<\/code> for reallocated and pending sectors. If they confirm it, and the array is still running on the other disk, I'd remove the failed member with mdadm, swap the drive by serial, add it back and watch the rebuild to 100%, then update the ticket with old and new serials.\"<\/p>\n<h2>Practise like it's real<\/h2>\n<p>Answer out loud, standing up, with a timer. Two minutes per answer. Record yourself and listen back once a week.<\/p>", "lab": "<p>Ask your recruiter (when you get back in touch in week 10, lesson 5) what the technical round covers. Meanwhile, open the <strong>Interview<\/strong> tab in this app, pick five questions, and answer each out loud before revealing the model answer.<\/p>", "quiz": [{"q": "You don't know an answer in the interview. Best move?", "o": ["Guess confidently", "Say how you'd find out and what evidence you'd collect first", "Change the subject"], "c": 1, "why": "Interviewers want to see your method and honesty."}, {"q": "What's the first thing to do with a vague scenario question?", "o": ["Ask a clarifying question", "Start listing commands", "Say it depends and stop"], "c": 0, "why": "Clarifying shows you think before acting."}, {"q": "Which of these strengthens a technical answer most?", "o": ["Mentioning many brand names", "Naming specific commands and what you'd look for in their output, plus how you'd verify", "Talking fast"], "c": 1, "why": "Specific, verifiable steps show real skill."}]}, {"id": "w10d2", "title": "Linux rapid-fire drill", "min": 25, "goal": "Answer the most common Linux questions in one or two sentences each, without notes.", "learn": "<p>Read each question, answer out loud, then check.<\/p>\n<p><strong>How do you check disk space?<\/strong> <code>df -h<\/code> for filesystems, <code>du -sh path<\/code> for what's using it, <code>df -i<\/code> for inodes.<\/p>\n<p><strong>How do you see running processes?<\/strong> <code>ps aux<\/code>, or <code>top<\/code>/<code>htop<\/code> live. <code>ps aux --sort=-%cpu | head<\/code> for the biggest.<\/p>\n<p><strong>How do you check if a service is running?<\/strong> <code>systemctl status name<\/code>; <code>systemctl --failed<\/code> lists everything that failed.<\/p>\n<p><strong>Where are logs?<\/strong> <code>journalctl<\/code> (with <code>-u<\/code>, <code>-b<\/code>, <code>-p err<\/code>, <code>--since<\/code>) and <code>/var/log/<\/code> (syslog, kern.log, auth.log).<\/p>\n<p><strong>How do you see kernel/hardware messages?<\/strong> <code>sudo dmesg -T<\/code>, or <code>journalctl -k<\/code>.<\/p>\n<p><strong>What does chmod 755 mean?<\/strong> Owner read/write/execute, group and others read/execute.<\/p>\n<p><strong>Hard link vs symlink?<\/strong> Hard link = another name for the same inode; symlink = a pointer to a path that breaks if the target is removed.<\/p>\n<p><strong>How do you find a file?<\/strong> <code>find /path -name \"pattern\"<\/code>. Search inside files with <code>grep -r<\/code>.<\/p>\n<p><strong>What's the difference between &gt; and &gt;&gt;?<\/strong> <code>&gt;<\/code> overwrites, <code>&gt;&gt;<\/code> appends.<\/p>\n<p><strong>How do you check memory?<\/strong> <code>free -h<\/code>; per-DIMM detail with <code>sudo dmidecode -t memory<\/code>.<\/p>\n<p><strong>How do you list hardware?<\/strong> <code>lscpu<\/code>, <code>lspci<\/code>, <code>lsblk<\/code>, <code>sudo lshw -short<\/code>, <code>sudo dmidecode<\/code>.<\/p>\n<p><strong>What is PID 1?<\/strong> systemd, the first process; it starts and manages services.<\/p>\n<p><strong>What's a load average?<\/strong> Average number of runnable/waiting processes over 1, 5, 15 minutes. Compare with <code>nproc<\/code>.<\/p>\n<p><strong>kill vs kill -9?<\/strong> SIGTERM asks the process to stop cleanly; SIGKILL forces it immediately.<\/p>\n<p><strong>What is sudo and why use it?<\/strong> Run one command as root, logged with your name. Least privilege and accountability.<\/p>\n<p><strong>Server says \"Read-only file system\".<\/strong> The filesystem was remounted read-only after errors. Check <code>dmesg<\/code> for disk/I/O errors before anything else.<\/p>", "lab": "<p>Do this drill twice: once today, once in three days. Mark any answer you hesitated on, and look it up in the earlier lesson.<\/p>", "term": {"intro": "Speed round. Answer each with one command as fast as you can.", "tasks": [{"p": "Which services have failed?", "c": {"t": "re", "v": "^systemctl\\s+--failed$"}, "h": "systemctl --failed"}, {"p": "Errors (and worse) from the kernel", "c": {"t": "re", "v": "^sudo\\s+dmesg\\s+.*(-l\\s*err|--level=err)"}, "h": "sudo dmesg -T -l err"}, {"p": "How full is every filesystem?", "c": {"t": "re", "v": "^df\\s+-h$"}, "h": "df -h"}, {"p": "What's the chassis serial number?", "c": {"t": "re", "v": "^sudo\\s+dmidecode\\s+-s\\s+system-serial-number$"}, "h": "sudo dmidecode -s system-serial-number"}, {"p": "What are the server's IP addresses?", "c": {"t": "re", "v": "^(ip\\s+-br\\s+a|ip\\s+a|hostname\\s+-I)$"}, "h": "ip -br a"}, {"p": "What's listening on which port?", "c": {"t": "re", "v": "^(sudo\\s+)?ss\\s+-\\w*l\\w*$"}, "h": "ss -tulpn"}]}, "quiz": [{"q": "Fastest way to see every failed service?", "o": ["systemctl --failed", "ps aux | grep fail", "journalctl -f"], "c": 0, "why": "One command, one answer."}, {"q": "df says the disk is full but du of / adds up to much less. Likely cause?", "o": ["du is broken", "Deleted files still held open by a process", "Swap is full"], "c": 1, "why": "Check sudo lsof +L1."}, {"q": "How do you see only error-level kernel messages?", "o": ["sudo dmesg -l err", "dmesg --errors-only", "journalctl -p info"], "c": 0, "why": "-l filters by level."}, {"q": "Which shows each DIMM's slot and serial?", "o": ["free -h", "lscpu", "sudo dmidecode -t memory"], "c": 2, "why": "Type 17 memory devices."}, {"q": "What does <code>2&gt;/dev/null<\/code> do?", "o": ["Hides error messages", "Hides normal output", "Sends output to a file called null"], "c": 0, "why": "stderr (2) to the bin."}, {"q": "What's <code>systemctl enable<\/code> for?", "o": ["Start a service now", "Start a service automatically at boot", "Show a service's logs"], "c": 1, "why": "enable = at boot; start = now."}]}, {"id": "w10d3", "title": "Hardware and networking rapid-fire drill", "min": 25, "goal": "Answer the most common hardware, storage and network questions crisply.", "learn": "<p><strong>Server won't power on.<\/strong> Check from outside in: PDU and outlet, power cords, PSU LEDs, BMC reachable? BMC SEL and power status. Then minimum configuration if procedure allows.<\/p>\n<p><strong>Server powers on but won't POST.<\/strong> BMC SEL and POST codes; reseat recently touched parts; minimum config (one CPU, one DIMM per procedure) to isolate.<\/p>\n<p><strong>How do you tell a bad DIMM from a bad slot?<\/strong> Move the DIMM. Error follows the DIMM → DIMM. Stays with the slot → board/CPU.<\/p>\n<p><strong>Which SMART attributes matter?<\/strong> Reallocated (5), pending (197), offline uncorrectable (198), reported uncorrect (187). CRC (199) = cable/backplane.<\/p>\n<p><strong>RAID 1 vs 5 vs 6 vs 10?<\/strong> Mirror; parity survives 1 failure; double parity survives 2; striped mirrors, fast and survives one per pair.<\/p>\n<p><strong>What does the BMC do?<\/strong> Out-of-band management: sensors, event log, power control, console, inventory, even when the OS is down.<\/p>\n<p><strong>OSI layers?<\/strong> Physical, data link, network, transport, session, presentation, application. Cable = 1, VLAN/MAC = 2, IP = 3, TCP/UDP = 4.<\/p>\n<p><strong>Usable hosts in /26?<\/strong> 64 − 2 = 62. /27 → 30, /28 → 14, /30 → 2.<\/p>\n<p><strong>TCP vs UDP?<\/strong> TCP: connection, guaranteed and ordered. UDP: no connection, best effort, lower overhead.<\/p>\n<p><strong>SMF vs MMF?<\/strong> Single-mode: 9 µm core, yellow, long reach, 1310/1550 nm. Multimode: 50 µm, aqua, short reach, 850 nm.<\/p>\n<p><strong>APC vs UPC?<\/strong> APC is angled (8°), green. UPC is flat, blue. Never mate them.<\/p>\n<p><strong>Link up but CRC errors?<\/strong> Signal quality: check DOM light levels per lane, inspect and clean both ends, then cable, optic, port, one change at a time.<\/p>\n<p><strong>What is LLDP?<\/strong> Neighbour discovery: shows which switch and port a NIC connects to.<\/p>\n<p><strong>What is a VLAN?<\/strong> A separate layer-2 network on shared switches, tagged with 802.1Q.<\/p>\n<p><strong>What's leaf-spine?<\/strong> Every leaf (ToR) connects to every spine; equal-cost paths (ECMP); predictable latency; scale by adding switches.<\/p>\n<p><strong>What's MTU, and the jumbo test?<\/strong> Max packet size; 1500 default, 9000 jumbo. <code>ping -M do -s 8972 host<\/code>.<\/p>\n<p><strong>Verify a wiped drive?<\/strong> Confirm serial; no partitions or filesystem signatures; sampled sectors read as zeros; report anything else.<\/p>", "lab": "<p>Say each answer out loud in under 20 seconds. If you go over, cut words, not facts.<\/p>", "term": {"intro": "Speed round on hardware and network evidence.", "tasks": [{"p": "Which disk has pending sectors?", "c": {"t": "re", "v": "^sudo\\s+smartctl\\s+-(A|a)\\s+/dev/sd[a-d]"}, "h": "sudo smartctl -A /dev/sdb"}, {"p": "Is the RAID healthy?", "c": {"t": "re", "v": "^cat\\s+/proc/mdstat$"}, "h": "cat /proc/mdstat"}, {"p": "Which switch port is ens1f1 on?", "c": {"t": "re", "v": "^(sudo\\s+)?lldpctl(\\s+ens1f1)?$"}, "h": "lldpctl ens1f1"}, {"p": "Is ens1f0's light in spec?", "c": {"t": "re", "v": "^sudo\\s+ethtool\\s+-m\\s+ens1f0"}, "h": "sudo ethtool -m ens1f0 | grep -i rcvr"}, {"p": "What does the BMC event log say?", "c": {"t": "re", "v": "^sudo\\s+ipmitool\\s+sel\\s+e?list"}, "h": "sudo ipmitool sel list"}]}, "quiz": [{"q": "Usable hosts in a /28?", "o": ["16", "14", "30"], "c": 1, "why": "2^4 − 2."}, {"q": "Which SMART attribute points at a cable rather than the disk surface?", "o": ["Reallocated_Sector_Ct", "UDMA_CRC_Error_Count", "Current_Pending_Sector"], "c": 1, "why": "CRC errors happen in transit."}, {"q": "Which RAID level survives two simultaneous disk failures?", "o": ["RAID 1", "RAID 5", "RAID 6"], "c": 2, "why": "Double parity."}, {"q": "Which colour connector is APC?", "o": ["Green", "Blue", "Beige"], "c": 0, "why": "Green = APC (angled), blue = UPC on single-mode."}, {"q": "What does <code>ping -M do -s 8972<\/code> test?", "o": ["Whether a full 9000-byte packet passes without fragmentation", "DNS speed", "Packet loss on the management network"], "c": 0, "why": "Jumbo-frame MTU test."}]}, {"id": "w10d4", "title": "Your stories: behavioural answers", "min": 30, "goal": "Have six real stories ready in STAR format, safe to tell without breaking confidentiality.", "learn": "<h2>STAR in two minutes<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Time<\/th>\n<th>Content<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>S<\/strong>ituation<\/td>\n<td>15 s<\/td>\n<td>Where, what was going on<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong>ask<\/td>\n<td>15 s<\/td>\n<td>What <em>you<\/em> were responsible for<\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong>ction<\/td>\n<td>60 s<\/td>\n<td>What <em>you<\/em> did, step by step. Say \"I\", not \"we\"<\/td>\n<\/tr>\n<tr>\n<td><strong>R<\/strong>esult<\/td>\n<td>30 s<\/td>\n<td>Outcome, numbers if possible, and what you learned<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Six stories to prepare<\/h2>\n<p>Build each from your own experience:<\/p>\n<ol>\n<li><strong>A tricky fault you diagnosed.<\/strong> For example tracking down a component with diagnostic tools and logs. Show method: evidence, isolation, verification.<\/li>\n<li><strong>A link or network problem.<\/strong> Your InfiniBand work: missing links, high BER, flapping. Show one-change-at-a-time.<\/li>\n<li><strong>Precision and documentation.<\/strong> A time careful ticket notes, transactions or RMA tracking prevented a mistake or saved time.<\/li>\n<li><strong>Learning fast.<\/strong> Going from new hire to L2-adjacent diagnostics in a few months, and now this Linux course in your own time alongside studies and work.<\/li>\n<li><strong>A mistake you made.<\/strong> Pick a real, small one. Own it, show how you fixed it and what you changed so it doesn't happen again.<\/li>\n<li><strong>Working with others under pressure.<\/strong> Heavy equipment, racking projects, a deadline, or disagreeing respectfully with a colleague and agreeing a plan.<\/li>\n<\/ol>\n<p>Add one about <strong>safety<\/strong>: stopping work because something wasn't safe, or following procedure when a shortcut was tempting.<\/p>\n<h2>Keep it confidential<\/h2>\n<p>You're under NDA at your current placement. Describe <strong>skills and situations<\/strong>, not specifics:<\/p>\n<ul>\n<li>Say \"a GPU cluster for AI workloads with an InfiniBand fabric\", not customer names, site details, internal tool names or numbers.<\/li>\n<li>If asked for something you can't share: \"I can't go into specifics because of confidentiality, but the approach was…\". Interviewers respect that; it's a positive signal for a role that handles customer data.<\/li>\n<\/ul>\n<h2>Also prepare<\/h2>\n<ul>\n<li><strong>\"Tell me about yourself\"<\/strong> (60–90 s): current role, the hardware you work with, your studies, why L2 and why Google.<\/li>\n<li><strong>\"Why Google, why Hamina?\"<\/strong>: scale, engineering culture, the site's seawater cooling and long history in Finland, building your career in Finland.<\/li>\n<li><strong>Questions for them<\/strong>: \"What does a typical shift look like for an L2 tech?\", \"How do techs grow from L2?\", \"What separates a great first year?\"<\/li>\n<\/ul>", "lab": "<p>Write the six stories in your Notes app, each in four short STAR bullet points, not full sentences. Then say each one out loud with a 2-minute timer.<\/p>", "quiz": [{"q": "In STAR, where should most of your time go?", "o": ["Situation", "Action", "Result"], "c": 1, "why": "The interviewer is scoring what you did."}, {"q": "You're asked about something covered by your NDA. Best response?", "o": ["Explain you can't share specifics, then describe the approach and skills in general terms", "Share the details anyway; it's an interview", "Refuse to answer and move on"], "c": 0, "why": "Respecting confidentiality is itself a strength for this role."}, {"q": "Which \"mistake\" story works best?", "o": ["One where someone else made the mistake", "A real, small mistake you owned, fixed and learned from", "Saying you never make mistakes"], "c": 1, "why": "Ownership and learning are what's being assessed."}, {"q": "\"We fixed the link\" vs \"I cleaned the MPO, then swapped the cable\". Which is better in an interview?", "o": ["We: it shows teamwork", "I: it shows what you personally did"], "c": 1, "why": "Say \"I\" for your actions. Mention teamwork where it's true, separately."}]}, {"id": "w10d5", "title": "Final mock and getting back in touch", "min": 30, "goal": "Run a full mock interview, check you're ready, and write the message to your recruiter.", "learn": "<h2>Readiness checklist<\/h2>\n<p>You're ready to ask for the technical round when you can, without notes:<\/p>\n<ul>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Move around the filesystem, read and search logs, use pipes (<code>grep<\/code>, <code>tail<\/code>, <code>less<\/code>, <code>|<\/code>, <code>&gt;<\/code>)<\/li>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Explain and set permissions (<code>chmod 644/755/600<\/code>) and use <code>sudo<\/code> correctly<\/li>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Check services and logs (<code>systemctl<\/code>, <code>journalctl<\/code>, <code>dmesg<\/code>)<\/li>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Inventory hardware and pull serials (<code>lscpu<\/code>, <code>lspci<\/code>, <code>lsblk<\/code>, <code>dmidecode<\/code>)<\/li>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Read memory errors, SMART, RAID state and the BMC SEL<\/li>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Diagnose a NIC/optic with <code>ip<\/code>, <code>ethtool -S<\/code>, <code>ethtool -m<\/code>, <code>lldpctl<\/code><\/li>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Subnet a /26 or /27 in your head<\/li>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Explain leaf-spine, VLANs, MTU, SMF/MMF, APC/UPC<\/li>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Talk through any scenario using the seven-step method<\/li>\n<li class=\"check\"><span class=\"cbox\" aria-hidden=\"true\"><\/span>Tell your six STAR stories in under 2 minutes each<\/li>\n<\/ul>\n<p>Optional extra proof: the <strong>LPI Linux Essentials<\/strong> certificate is an entry-level exam that shows the basics on paper.<\/p>\n<h2>Mock interview (45 minutes)<\/h2>\n<p>Use the <strong>Interview<\/strong> tab. Pick 10 questions: 3 Linux, 2 hardware, 2 networking, 2 scenarios, 1 behavioural. Answer out loud with a timer, then reveal the model answer and mark yourself honestly. Mark the ones you got as \"confident\". Repeat in a few days with different questions.<\/p>\n<h2>Message to your recruiter<\/h2>\n<p>Keep it short, specific and positive. Send it when you've worked through the checklist:<\/p>\n<pre><code>Subject: Data Center Technician II, Hamina - ready for the technical round\n\nHi [name],\n\nThanks again for our conversation on [date]. You suggested I build\nup my Linux skills before the technical interview, so I've spent the\npast weeks on a structured study plan alongside my work:\n\n- Linux administration: files, permissions, systemd, journalctl,\n  dmesg, bash scripting\n- Hardware diagnostics from Linux: dmidecode, SMART/NVMe health,\n  mdadm RAID, ipmitool and BMC event logs, GPU/PCIe checks\n- Networking: subnetting, ip/ethtool/lldp diagnostics, optics and\n  DOM readings, leaf-spine fabrics\n\nI've practised all of it hands-on in my own Ubuntu lab. I'd love to\ncontinue with the technical round whenever it suits the team.\nCould you share what the technical interview will cover?\n\nBest regards,\n[Your name]\n<\/code><\/pre>\n<p>Edit it so every line is true for you when you send it.<\/p>", "lab": "<p>Do the 45-minute mock today. Tomorrow, send the message (or come back to Claude and ask for help tailoring it). Good luck.<\/p>", "term": {"intro": "Final check: run a full health review of dc-lab-07, the way you'd start any shift on a new host.", "tasks": [{"p": "Who and where am I?", "c": {"t": "re", "v": "^(hostname|whoami|uname\\s+-a)$"}, "h": "hostname"}, {"p": "Run the health-check script", "c": {"t": "any", "v": "healthcheck\\.sh"}, "h": "./scripts/healthcheck.sh"}, {"p": "Failed services", "c": {"t": "re", "v": "^systemctl\\s+--failed$"}, "h": "systemctl --failed"}, {"p": "Recent hardware events from the BMC", "c": {"t": "re", "v": "^sudo\\s+ipmitool\\s+sel\\s+e?list"}, "h": "sudo ipmitool sel list"}, {"p": "Kernel errors", "c": {"t": "re", "v": "^sudo\\s+dmesg\\s+.*(-l\\s*err|--level=err)"}, "h": "sudo dmesg -T -l err"}, {"p": "Disk and RAID state", "c": {"t": "re", "v": "^cat\\s+/proc/mdstat$"}, "h": "cat /proc/mdstat"}, {"p": "Network link and errors on the main uplink", "c": {"t": "re", "v": "^ethtool\\s+-S\\s+ens1f0"}, "h": "ethtool -S ens1f0 | grep -iE \"crc|down\""}]}, "quiz": [{"q": "When should you ask the recruiter for the technical round?", "o": ["When you can work the readiness checklist without notes", "Immediately, before studying", "Only after getting a certificate"], "c": 0, "why": "Be honest with yourself; the checklist is your bar."}, {"q": "What makes a good follow-up message to a recruiter?", "o": ["Short, specific about what you learned, and asking a clear next step", "Long and detailed with every command you learned", "Asking them to skip the technical round"], "c": 0, "why": "Show progress, ask for the next step."}, {"q": "In the mock interview, why mark yourself honestly?", "o": ["So your next study session targets your real weak spots", "To impress the app", "Because it changes the course"], "c": 0, "why": "Honest scores make practice efficient."}]}]}], "bank": [{"name": "Linux", "qs": [{"q": "What's the difference between a process and a service?", "a": "<p>A process is any running program with a PID. A service is a process (or group of them) that systemd starts, supervises and can restart, defined by a unit file. You manage services with <code>systemctl<\/code>, not by killing processes.<\/p>"}, {"q": "How do you check which services have failed on a server?", "a": "<p><code>systemctl --failed<\/code>. Then <code>systemctl status &lt;unit&gt;<\/code> for the reason, and <code>journalctl -u &lt;unit&gt; -b<\/code> for the full log of this boot.<\/p>"}, {"q": "Where would you look for logs on a Linux server?", "a": "<p><code>journalctl<\/code> for the systemd journal (filter with <code>-u<\/code>, <code>-b<\/code>, <code>-k<\/code>, <code>-p err<\/code>, <code>--since<\/code>), and text logs in <code>/var/log/<\/code>: <code>syslog<\/code>, <code>kern.log<\/code>, <code>auth.log<\/code>. For hardware, <code>sudo dmesg -T<\/code> and the BMC's SEL.<\/p>"}, {"q": "A filesystem is full. Walk me through finding the cause.", "a": "<p><code>df -h<\/code> to see which filesystem. <code>sudo du -sh /path/* | sort -h<\/code> and drill down to the biggest folder or file. If <code>df<\/code> and <code>du<\/code> disagree, check <code>sudo lsof +L1<\/code> for deleted files still held open. Also check <code>df -i<\/code> for inode exhaustion. Don't delete anything owned by another team without agreement; truncating a live log is safer than deleting it.<\/p>"}, {"q": "What does chmod 640 mean, and when would you use it?", "a": "<p>Owner read/write, group read, others nothing. Typical for log files readable by an admin group, like <code>/var/log/syslog<\/code> owned by <code>syslog:adm<\/code>.<\/p>"}, {"q": "Why use sudo instead of logging in as root?", "a": "<p>Least privilege and accountability: you only get root for the command that needs it, you think before each one, and every sudo command is logged with your username.<\/p>"}, {"q": "Hard link vs symbolic link?", "a": "<p>A hard link is another name for the same inode; the data survives while any name exists, but it can't cross filesystems or point to directories. A symlink stores a path; it can point anywhere but breaks if the target is removed.<\/p>"}, {"q": "How do you see what's using the most CPU or memory?", "a": "<p><code>top<\/code> or <code>htop<\/code> (press P for CPU, M for memory), or <code>ps aux --sort=-%cpu | head<\/code> and <code>ps aux --sort=-%mem | head<\/code>.<\/p>"}, {"q": "What's the load average and how do you interpret it?", "a": "<p>The average number of processes running or waiting for CPU (and uninterruptible I/O) over 1, 5 and 15 minutes. Compare it with the CPU count from <code>nproc<\/code>. Load near or above the CPU count means work is queuing.<\/p>"}, {"q": "What's the difference between SIGTERM and SIGKILL?", "a": "<p>SIGTERM (15, the default for <code>kill<\/code>) asks a process to exit and lets it clean up. SIGKILL (9) forces it to stop immediately with no cleanup. Use SIGKILL only as a last resort, and use <code>systemctl stop<\/code> for services.<\/p>"}, {"q": "How do you find all files ending in .log under /var that are bigger than 1 GB?", "a": "<p><code>sudo find /var -name \"*.log\" -size +1G<\/code>.<\/p>"}, {"q": "What is /proc?", "a": "<p>A virtual filesystem the kernel generates on the fly with live information about processes and the system, for example <code>/proc/cpuinfo<\/code>, <code>/proc/meminfo<\/code>, <code>/proc/mdstat<\/code>. Nothing in it is stored on disk.<\/p>"}, {"q": "How does a Linux server boot?", "a": "<p>Firmware (UEFI/BIOS) runs POST and memory training, picks a boot device, starts the bootloader (GRUB), which loads the kernel and initramfs. The kernel mounts the root filesystem and starts systemd as PID 1, which mounts the rest from <code>/etc/fstab<\/code> and starts services until the default target (usually <code>multi-user.target<\/code>) is reached.<\/p>"}, {"q": "The root filesystem suddenly became read-only. What happened and what do you check?", "a": "<p>ext4 is usually mounted with <code>errors=remount-ro<\/code>, so it switches to read-only when it detects errors, to protect data. Check <code>sudo dmesg -T<\/code> for disk I/O or filesystem errors, then SMART on the underlying disk and RAID state. Don't just remount read-write; find the cause.<\/p>"}, {"q": "What does <code>2&gt;&amp;1<\/code> mean?", "a": "<p>Send standard error (2) to the same place as standard output (1). For example <code>cmd &gt; out.txt 2&gt;&amp;1<\/code> captures both in one file.<\/p>"}, {"q": "How would you run a long command over SSH so it survives a disconnect?", "a": "<p>Run it inside <code>tmux<\/code> (or <code>screen<\/code>), detach, and reattach later. <code>nohup<\/code> is an older alternative.<\/p>"}]}, {"name": "Hardware", "qs": [{"q": "A server won't power on. What do you check?", "a": "<p>Outside in: is the PDU/outlet live, are both power cords seated, what do the PSU LEDs show, is the BMC reachable (it runs on standby power)? Check <code>ipmitool chassis status<\/code> and the SEL for power faults. Swap a PSU or cord with a known-good one per procedure. Then escalate with what you found.<\/p>"}, {"q": "A server powers on but doesn't POST. How do you isolate it?", "a": "<p>Watch the BMC console and POST codes, read the SEL for CPU/memory errors. Reseat anything recently touched. If procedure allows, strip to minimum configuration (one CPU, minimum DIMMs, no add-in cards) and add parts back one at a time until it fails.<\/p>"}, {"q": "How do you tell a bad DIMM from a bad slot?", "a": "<p>Move the suspect DIMM to a known-good slot (or put a known-good DIMM in the suspect slot). If the errors follow the DIMM, it's the DIMM. If they stay with the slot, suspect the board, the CPU socket or the CPU's memory controller.<\/p>"}, {"q": "Correctable vs uncorrectable memory errors?", "a": "<p>ECC fixes correctable errors and the system keeps running, but they're logged. A rising count on one DIMM predicts failure, so it's replaced proactively. Uncorrectable errors can't be fixed: they usually cause a crash or reboot and need urgent replacement.<\/p>"}, {"q": "How do you get a server's serial number and its DIMM serials from Linux?", "a": "<p><code>sudo dmidecode -s system-serial-number<\/code> for the chassis, <code>sudo dmidecode -t memory<\/code> for each DIMM slot's size, part number and serial. <code>sudo ipmitool fru print<\/code> gives FRU serials from the BMC too.<\/p>"}, {"q": "What is the BMC and what do you use it for?", "a": "<p>A small independent computer on the motherboard with its own network port, powered whenever the server has power. It gives out-of-band access: sensors, the System Event Log, power control, locate LED, Serial over LAN console and remote KVM, hardware inventory. It works even when the OS is down. Tools: <code>ipmitool<\/code>, the web UI, or Redfish.<\/p>"}, {"q": "What would you check after replacing a part?", "a": "<p>That the part is detected with the right identity (new serial in <code>dmidecode<\/code>, <code>lspci<\/code>, <code>lsblk<\/code> or <code>nvidia-smi<\/code>), the counts are right (all DIMMs, all GPUs), PCIe links are at full width and speed, no new errors in <code>dmesg<\/code> or the SEL, diagnostics pass, and the ticket has old and new serials.<\/p>"}, {"q": "A GPU node shows 7 of 8 GPUs. What do you do?", "a": "<p>Collect evidence: <code>nvidia-smi<\/code>, <code>lspci<\/code> (rev ff?), <code>dmesg<\/code> for Xid (79 = fallen off the bus) and AER errors, the BMC SEL, the vendor's bug report. Identify the GPU by PCI bus ID and serial, not index. Escalate with the bundle and follow the vendor procedure: typically drain, reboot, run diagnostics, then reseat or replace if it recurs. Also check power and thermals.<\/p>"}, {"q": "What does <code>LnkSta: Width x8 (downgraded)<\/code> mean in lspci?", "a": "<p>The PCIe link trained narrower than the device supports (LnkCap). The device works with less bandwidth. Usually a seating, riser, cable or slot problem: reseat per procedure and check again.<\/p>"}, {"q": "What is an Xid error?", "a": "<p>An error code logged by the NVIDIA driver in <code>dmesg<\/code> as <code>NVRM: Xid<\/code>. For example 79 = GPU fell off the bus, 48 = double-bit ECC error, 63/64 = row remapping events, 74 = NVLink error. Some codes, like 13 or 31, are usually caused by the application rather than hardware.<\/p>"}, {"q": "What precautions do you take before working inside a server?", "a": "<p>Confirm the right host (asset tag, serial, locate LED), make sure it's drained and the work is approved, shut down via the approved process, remove power, wear an ESD strap, use proper lifting technique or equipment for heavy units, and photograph or note labels and serials before and after.<\/p>"}]}, {"name": "Storage", "qs": [{"q": "How do you check if a disk is failing?", "a": "<p><code>sudo smartctl -H<\/code> for the verdict, but mainly <code>-A<\/code> or <code>-a<\/code>: reallocated sectors (5), pending (197), offline uncorrectable (198), reported uncorrect (187) growing. Plus <code>dmesg<\/code> I/O errors on that disk and RAID marking it faulty. PASSED alone doesn't mean healthy.<\/p>"}, {"q": "A disk shows a rising UDMA_CRC_Error_Count but nothing else. What do you do?", "a": "<p>CRC errors happen between the disk and the controller: suspect the cable, backplane or connector first. Reseat or replace the cable, then see if the count stops rising.<\/p>"}, {"q": "Explain RAID 0, 1, 5, 6 and 10.", "a": "<p>RAID 0 stripes for speed with no redundancy. RAID 1 mirrors (survives one disk of two). RAID 5 stripes with parity (survives one failure). RAID 6 uses double parity (survives two). RAID 10 stripes across mirrors (fast, survives one failure per mirror pair). None of them is a backup.<\/p>"}, {"q": "How do you replace a failed disk in a Linux software RAID 1?", "a": "<p>Confirm the failed member by serial and slot (mdstat, mdadm --detail, SMART, BMC fault). <code>mdadm --manage /dev/md0 --remove<\/code> the failed partition (fail it first if needed), swap the physical disk, copy the partition table from the healthy disk, <code>mdadm --add<\/code> the new partition, and watch <code>/proc/mdstat<\/code> until recovery completes. Never pull the healthy disk.<\/p>"}, {"q": "How do you check NVMe health?", "a": "<p><code>sudo nvme smart-log /dev/nvme0<\/code>: critical_warning should be 0, media_errors 0, check percentage_used for wear and available_spare. <code>smartctl -a /dev/nvme0<\/code> shows the same.<\/p>"}, {"q": "Why can device names like /dev/sdb change, and how do you identify disks reliably?", "a": "<p>Names are assigned in detection order at boot, so adding, removing or failing disks can shift them. Use the serial number (<code>lsblk -o NAME,SERIAL<\/code>, <code>/dev/disk/by-id/<\/code>), the physical slot and the locate LED.<\/p>"}]}, {"name": "Networking", "qs": [{"q": "Explain the OSI model in terms of datacenter work.", "a": "<p>Layer 1 physical: cables, optics, light, link. Layer 2: Ethernet, MAC addresses, switches, VLANs. Layer 3: IP addresses and routing. Layer 4: TCP and UDP ports. Layer 7: applications like SSH, DNS, HTTPS. Troubleshoot from the bottom up.<\/p>"}, {"q": "How many usable hosts are in a /26, /27 and /29?", "a": "<p>62, 30 and 6. Usable = 2^(32 − prefix) − 2 for network and broadcast addresses.<\/p>"}, {"q": "What's the network and broadcast address of 10.1.1.100/27?", "a": "<p>/27 blocks are 32 wide: 0, 32, 64, 96, 128… 100 is in the 96 block, so network 10.1.1.96, broadcast 10.1.1.127, usable .97–.126.<\/p>"}, {"q": "TCP vs UDP?", "a": "<p>TCP is connection-oriented with guaranteed, ordered delivery and retransmission (SSH, HTTPS). UDP is connectionless and best-effort with less overhead (DNS queries, NTP, streaming).<\/p>"}, {"q": "A server has link but can't reach its gateway. What do you check?", "a": "<p><code>ip -br a<\/code> for the right IP and subnet, <code>ip route<\/code> for the right gateway, <code>ip neigh<\/code> to see if ARP resolves the gateway, <code>ping<\/code> the gateway. If ARP fails: VLAN or switch port config (network team), or wrong subnet. Check <code>ethtool -S<\/code> for errors and <code>lldpctl<\/code> to confirm the cable lands on the expected switch port.<\/p>"}, {"q": "What is a VLAN and what's the difference between access and trunk ports?", "a": "<p>A VLAN is a separate layer-2 network on shared switches, identified by an 802.1Q tag (1–4094). An access port carries one VLAN untagged; a trunk carries several tagged VLANs.<\/p>"}, {"q": "Explain leaf-spine.", "a": "<p>Servers connect to leaf (top-of-rack) switches; every leaf connects to every spine. Any server reaches any other in leaf → spine → leaf, with many equal-cost paths used together (ECMP). Losing a spine reduces capacity rather than causing an outage, and it scales by adding switches.<\/p>"}, {"q": "What is MTU and how do you test it?", "a": "<p>The largest packet an interface sends without fragmenting: 1500 by default, 9000 for jumbo frames. Test with <code>ping -M do -s 8972 host<\/code> (8972 + 28 bytes of headers = 9000). Mismatched MTU causes small traffic to work while large transfers hang.<\/p>"}, {"q": "How do you find which switch port a server is connected to?", "a": "<p>From the server: <code>lldpctl<\/code> shows the neighbour switch name and port. Physically: follow the label, check the port map, or blink the NIC LED with <code>ethtool -p<\/code>.<\/p>"}, {"q": "What does LACP bonding do?", "a": "<p>Combines two or more links into one logical interface for more bandwidth and redundancy; if one link or switch fails, traffic continues on the others.<\/p>"}, {"q": "What's the difference between ping failing with \"Destination Host Unreachable\" and with 100% packet loss?", "a": "<p>Unreachable from your own IP means ARP got no answer on the local subnet (host down, wrong VLAN or subnet). Plain 100% loss means packets left but nothing came back (routing, firewall, host down). \"Name resolution\" errors are DNS, not the network path.<\/p>"}, {"q": "What's out-of-band management?", "a": "<p>A separate management network for BMCs and switch management ports, independent of production, so hardware stays reachable even when the production network or OS is down.<\/p>"}]}, {"name": "Fiber and cabling", "qs": [{"q": "Single-mode vs multimode fiber?", "a": "<p>Single-mode (OS2): 9 µm core, usually yellow, 1310/1550 nm lasers, long reach (km). Multimode (OM3/OM4): 50 µm core, usually aqua, 850 nm VCSEL, short reach (around 70–100 m at 100G-SR4). Never mix them in one link.<\/p>"}, {"q": "APC vs UPC?", "a": "<p>APC has an 8° angled end face and a green connector; UPC is flat-polished, usually blue on single-mode. Mating APC to UPC causes high loss and can damage the end faces.<\/p>"}, {"q": "A 100G link has CRC errors and one lane's RX power is 10 dB lower than the others. What do you do?", "a": "<p>That points at one fiber in the MPO path. With the network team: inspect and clean both ends, re-inspect, re-check light; then reseat, swap the cable, swap optics, then try another switch port, one change at a time, recording RX power and counters after each. Verify all lanes in spec and counters stop increasing.<\/p>"}, {"q": "What's the correct procedure for connecting a fiber?", "a": "<p>Inspect the end face with a scope, clean it, inspect again, then connect. Keep dust caps on. Respect bend radius. Never look into a fiber or port: the light is invisible infrared.<\/p>"}, {"q": "DAC vs AOC vs optics?", "a": "<p>DAC: copper twinax with fixed ends, short (in-rack), cheapest and lowest power. AOC: fiber with fixed transceiver ends, longer reach. Optics plus patch fiber: most flexible and longest reach, parts replaceable separately.<\/p>"}, {"q": "Explain dBm.", "a": "<p>Optical power relative to 1 mW on a log scale: 0 dBm = 1 mW, every −3 dB is roughly half, every −10 dB is a tenth. Compare RX power with the module's warning and alarm thresholds from <code>ethtool -m<\/code>.<\/p>"}]}, {"name": "Scenarios", "qs": [{"q": "A ticket says a disk failed in a RAID 1 boot mirror. Walk me through it.", "a": "<p>Confirm the host and the disk: <code>/proc/mdstat<\/code> and <code>mdadm --detail<\/code> for the faulty member, <code>dmesg<\/code> for I/O errors, <code>smartctl<\/code> for counters, serial via <code>lsblk -o NAME,SERIAL<\/code>, and the BMC's drive-fault slot. Make sure the array is still running on the healthy disk. Remove the failed member, swap the drive matching the serial, copy the partition table, add it back, watch the rebuild to 100%, install the bootloader on the new disk per procedure, and document old and new serials.<\/p>"}, {"q": "Monitoring reports rising corrected memory errors on one DIMM. What do you do?", "a": "<p>Confirm the slot from two sources (rasdaemon label and BMC SEL), record the DIMM serial with <code>dmidecode<\/code>, confirm the host is drained, power down per procedure with ESD protection, replace the DIMM in that exact slot, power on and watch POST, verify total memory and the new serial, run the memory test, monitor that errors stay at zero, document. If errors persist in the same slot, escalate as a board/CPU issue.<\/p>"}, {"q": "A NIC port keeps flapping. How do you approach it?", "a": "<p>Gather: <code>dmesg<\/code> link down/up times, <code>ethtool -S<\/code> CRC/symbol/link-down counters and per-lane errors, <code>ethtool -m<\/code> light levels per lane, <code>lldpctl<\/code> for the far end. Coordinate with the network team and change one thing at a time: clean and inspect, reseat, swap cable, swap optic, swap port. Verify counters stop increasing over a soak period.<\/p>"}, {"q": "After a reboot the server doesn't come back. Where do you start?", "a": "<p>The BMC: power status, chassis faults, new SEL events, then Serial over LAN to see where boot stops: POST, PXE, GRUB, kernel panic or emergency mode. Each stage points at different causes (hardware, boot device, bootloader, kernel/driver, fstab/filesystem).<\/p>"}, {"q": "You're asked to replace a part, but the serial on the part in the slot doesn't match the ticket. What do you do?", "a": "<p>Stop. Don't replace anything. Re-check the host, slot and ticket, and escalate to whoever raised it. A mismatch can mean the wrong server, wrong slot or stale data, and replacing a healthy part creates a second problem.<\/p>"}, {"q": "You find something wrong that isn't part of your ticket, like a PSU with no AC input. What do you do?", "a": "<p>Finish or safely pause your current task, then report the new finding separately through the proper channel with evidence. Don't silently fix it outside the process, and don't ignore it.<\/p>"}, {"q": "A runbook step doesn't match what you see on the server. What do you do?", "a": "<p>Stop and don't improvise on production. Re-verify you're on the right asset, then escalate to your lead with what you see. Afterwards, suggest a runbook update so the next person doesn't hit the same issue.<\/p>"}, {"q": "How do you prioritise several urgent tickets?", "a": "<p>Safety first, then customer or production impact and severity/SLA, then anything that blocks other work. Communicate with your lead about anything you can't reach in time instead of silently dropping it.<\/p>"}]}, {"name": "Security and safety", "qs": [{"q": "How do you verify that a decommissioned drive is properly erased?", "a": "<p>Confirm the serial against the ticket, check there are no partitions or filesystem signatures (<code>lsblk -f<\/code>, <code>blkid<\/code>), and read sample sectors at the start, middle and end (<code>hexdump -C<\/code>): they should be zeros or a uniform pattern. Anything else means not erased: stop, don't browse it, and report it through the ticket so it goes to the right workflow.<\/p>"}, {"q": "Why does chain of custody matter for storage media?", "a": "<p>Drives may contain customer data. Tracking every drive by serial from removal to erasure or destruction, keeping it inside the secure area and following the approved process ensures no data leaves uncontrolled.<\/p>"}, {"q": "What safety practices matter on the datacenter floor?", "a": "<p>ESD protection for components, safe lifting and proper equipment for heavy servers, awareness of live power and correct lockout procedures, laser safety with optics, keeping aisles clear of cables and tools, and stopping work whenever something is unsafe.<\/p>"}, {"q": "Someone you don't recognise follows you through a secure door. What do you do?", "a": "<p>Don't let them tailgate. Politely ask them to badge in themselves or contact security, following site policy. Physical security is everyone's job.<\/p>"}]}, {"name": "Behavioural", "qs": [{"q": "Tell me about yourself.", "a": "<p>Aim for 60–90 seconds: L1 datacenter technician working on GPU servers and their networking (hardware swaps, RMA workflows, InfiniBand link troubleshooting, diagnostics and precise ticket documentation), studying a business degree alongside work, recently put in a structured Linux study plan to grow into L2, and why Google's scale and Hamina's site appeal to you.<\/p>"}, {"q": "Tell me about the hardest fault you've diagnosed.", "a": "<p>STAR: symptom and impact, what you were responsible for, how you gathered evidence and isolated the cause step by step, the fix, how you verified it, and what you learned. Keep confidential details general.<\/p>"}, {"q": "Tell me about a mistake you made.", "a": "<p>A real, small one. Own it, explain how you noticed and fixed it, and what you changed (checklist, double-check, documentation) so it doesn't happen again.<\/p>"}, {"q": "Describe a time you disagreed with a colleague or lead.", "a": "<p>Show you raised your view with evidence, listened, agreed on a plan, and committed to it, even if it wasn't your idea. End with the outcome.<\/p>"}, {"q": "Tell me about a time you learned something technical quickly.", "a": "<p>For example getting up to speed on InfiniBand fabric troubleshooting in your first months, or teaching yourself Linux administration alongside work and studies: how you learned, how you practised, and the result.<\/p>"}, {"q": "How do you handle repetitive, detailed work without making mistakes?", "a": "<p>Checklists, verifying identity (hostname, slot, serial) every time, documenting as you go rather than at the end, and pausing to re-check before any irreversible step. Give a concrete example from RMA or inventory work.<\/p>"}, {"q": "Describe working under pressure.", "a": "<p>A time-critical repair or project: how you prioritised, communicated with the team, stayed safe and accurate, and what the result was.<\/p>"}, {"q": "Why do you want to move from L1 to L2?", "a": "<p>You want to own problems from diagnosis to verified fix, not just follow a script: reading the evidence yourself, deciding the next step, and helping others. Mention what you've done to prepare.<\/p>"}]}, {"name": "Google and Hamina", "qs": [{"q": "Why Google?", "a": "<p>Scale and engineering quality: running infrastructure where automation, reliability and careful process really matter, and the chance to learn from that. Link it to your own interest in precise hardware work and growing into deeper troubleshooting.<\/p>"}, {"q": "Why Hamina?", "a": "<p>Google's Hamina data center has operated since 2011 in a converted paper mill and is known for cooling with seawater from the Gulf of Finland. It lets you build a long-term career in Finland at one of Google's European sites. Be ready to explain your plan for commuting or relocating.<\/p>"}, {"q": "Are you comfortable with shift work, weekends and physical work?", "a": "<p>The posting mentions non-standard hours including nights, weekends and holidays, and lifting around 23 kg. Answer honestly and concretely, using your current physical datacenter work (racking, heavy equipment) as evidence.<\/p>"}, {"q": "What do you know about how Google runs its data centers?", "a": "<p>Highlights you can mention: heavy automation, strong focus on energy efficiency, published papers on its datacenter network (Jupiter), and strict security and media-handling processes. Keep it to what you've actually read.<\/p>"}, {"q": "What questions do you have for us?", "a": "<p>\"What does a typical shift look like for an L2 tech?\", \"How do techs grow from L2 to the next level?\", \"What separates someone who does great in their first year?\", \"How do techs and automation work together on repairs here?\"<\/p>"}]}]};</script>
<script>/* ===== Lab machine data: dc-lab-07 (a training server where several things are broken on purpose) ===== */
const LAB = (() => {
