last one answers \"which users run the most processes?\"<\/p>", "term": {"intro": "Answer questions about the inventory with one-liners.", "tasks": [{"p": "Show the header plus the first two rows", "c": {"t": "re", "v": "^head\\s+(-n\\s*3|-3)\\s+inventory\\.csv$"}, "h": "head -n 3 inventory.csv"}, {"p": "Count assets per status (column 8)", "c": {"t": "re", "v": "^cut\\s+-d\\s*,\\s+-f\\s*8\\s+inventory\\.csv\\s*\\|\\s*sort\\s*\\|\\s*uniq\\s+-c"}, "h": "cut -d, -f8 inventory.csv | sort | uniq -c"}, {"p": "Print hostname and serial for every rma unit with awk", "c": {"t": "re", "v": "^awk\\s+-F\\s*,?\\s*'\\$8\\s*==\\s*\"rma\"\\s*\\{\\s*print\\s+\\$2\\s*,\\s*\\$7\\s*\\}'\\s+inventory\\.csv$"}, "h": "awk -F, '$8==\"rma\" {print $2, $7}' inventory.csv"}, {"p": "Count how many assets each rack holds, biggest first", "c": {"t": "re", "v": "cut\\s+-d\\s*,\\s+-f\\s*4.*\\|\\s*sort.*\\|\\s*uniq\\s+-c\\s*\\|\\s*sort\\s+-(rn|nr)"}, "h": "tail -n +2 inventory.csv | cut -d, -f4 | sort | uniq -c | sort -rn"}, {"p": "Replace in-service with LIVE in the output (not the file)", "c": {"t": "re", "v": "^sed\\s+['\"]s/in-service/LIVE/g?['\"]\\s+inventory\\.csv"}, "h": "sed 's/in-service/LIVE/' inventory.csv"}]}, "quiz": [{"q": "Why does <code>uniq -c<\/code> usually come after <code>sort<\/code>?", "o": ["uniq needs sorted input to work at all", "uniq only merges duplicates that are next to each other", "sort makes uniq faster"], "c": 1, "why": "uniq compares each line with the one before it. Sorting puts equal lines together."}, {"q": "What does <code>cut -d, -f2,8 inventory.csv<\/code> print?", "o": ["Fields 2 and 8 of each line, splitting on commas", "Characters 2 to 8 of each line", "Lines 2 and 8"], "c": 0, "why": "-d sets the delimiter, -f picks the fields."}, {"q": "Which awk prints the hostname (field 2) of rows whose status (field 8) is spare?", "o": ["awk '{print $2}' inventory.csv | grep spare", "awk -F, '$8==\"spare\" {print $2}' inventory.csv", "awk -F, '$2==\"spare\" {print $8}' inventory.csv"], "c": 1, "why": "-F, splits on commas; the condition comes before the braces."}, {"q": "You want to sort <code>du -sh<\/code> output (sizes like 4.0K, 120G, 1.3T) correctly. Which sort?", "o": ["sort -n", "sort -h", "sort -r"], "c": 1, "why": "-h understands human-readable size suffixes. -n would put 120G before 4.0K."}]}]}, {"n": 3, "title": "Users, permissions and software", "summary": "Who can do what on a server, how sudo works, how permissions protect files, and how to install tools.", "lessons": [{"id": "w3d1", "title": "Users, groups and sudo", "min": 25, "goal": "Understand root, normal users and sudo well enough to explain why techs don't log in as root.", "learn": "<p>Every process and file on Linux belongs to a <strong>user<\/strong>. Users have a name and a number (UID).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>User<\/th>\n<th>UID<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>root<\/code><\/td>\n<td>0<\/td>\n<td>Can do anything. No safety net<\/td>\n<\/tr>\n<tr>\n<td>System users (<code>syslog<\/code>, <code>sshd<\/code>, <code>_chrony<\/code>…)<\/td>\n<td>1–999<\/td>\n<td>Run services; can't log in<\/td>\n<\/tr>\n<tr>\n<td>People (<code>tech<\/code>, <code>ubuntu<\/code>)<\/td>\n<td>1000+<\/td>\n<td>Normal accounts<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Where users are stored<\/h2>\n<p><code>/etc/passwd<\/code> lists users, one per line, fields split by <code>:<\/code>:<\/p>\n<pre><code>tech:x:1000:1000:DC Technician,,,:/home/tech:/bin/bash\n<\/code><\/pre>\n<p>name : password placeholder : UID : GID : description : home : shell. The <code>x<\/code> means the real password hash is in <code>/etc/shadow<\/code>, which only root can read. Groups are in <code>/etc/group<\/code>.<\/p>\n<p><code>id<\/code> shows your UID, your main group and every group you're in. On Ubuntu, being in the <code>sudo<\/code> group lets you use sudo, and <code>adm<\/code> lets you read most logs.<\/p>\n<h2>sudo: borrow root for one command<\/h2>\n<pre><code>cat /etc/shadow          # Permission denied\nsudo cat /etc/shadow     # works, as root, for this one command\n<\/code><\/pre>\n<p>Why not just log in as root all day?<\/p>\n<ul>\n<li><strong>Mistakes:<\/strong> as root, a typo can delete the system. With sudo you think once per command.<\/li>\n<li><strong>Accountability:<\/strong> every sudo command is logged with your name in <code>/var/log/auth.log<\/code>. On a shared fleet, that audit trail matters.<\/li>\n<li><strong>Least privilege:<\/strong> you get exactly the power you need, when you need it.<\/li>\n<\/ul>\n<p><code>sudo -l<\/code> shows what you're allowed to run. <code>sudo -i<\/code> opens a root shell, which you should use sparingly and leave with <code>exit<\/code>. On Ubuntu, root has no password at all. The only way in is sudo.<\/p>\n<h2>In the datacenter<\/h2>\n<p>You'll often have limited, audited access rather than full root. Commands that only <strong>read<\/strong> (logs, SMART, sensors) are low risk. Commands that <strong>change<\/strong> state (restart services, power off, wipe) go through the ticket and procedure. Interviewers like hearing you make that distinction.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>id\nwhoami\ngrep ubuntu /etc/passwd\nsudo grep ubuntu /etc/shadow\nsudo grep -i sudo /var/log/auth.log | tail -n 3\n<\/code><\/pre>\n<p>The last command shows your own sudo use being logged.<\/p>", "term": {"intro": "Explore users and sudo on dc-lab-07.", "tasks": [{"p": "Show your user ID and groups", "c": {"t": "re", "v": "^id$"}, "h": "id"}, {"p": "Find your own line in /etc/passwd", "c": {"t": "re", "v": "^(grep\\s+['\"]?tech['\"]?\\s+/etc/passwd|cat\\s+/etc/passwd\\s*\\|\\s*grep\\s+['\"]?tech['\"]?)$"}, "h": "grep tech /etc/passwd"}, {"p": "Try to read /etc/shadow as yourself", "c": {"t": "fail", "v": "^cat\\s+/etc/shadow$"}, "h": "cat /etc/shadow"}, {"p": "Read it with sudo", "c": {"t": "re", "v": "^sudo\\s+cat\\s+/etc/shadow"}, "h": "sudo cat /etc/shadow"}, {"p": "Check what sudo lets you run", "c": {"t": "re", "v": "^sudo\\s+-l$"}, "h": "sudo -l"}, {"p": "Find the logged sudo commands in auth.log", "c": {"t": "re", "v": "^grep\\s+(-\\w+\\s+)*['\"]?sudo['\"]?\\s+/var/log/auth\\.log$"}, "h": "grep sudo /var/log/auth.log"}]}, "quiz": [{"q": "Which UID does root have?", "o": ["0", "1", "1000"], "c": 0, "why": "Root is always UID 0. That number, not the name, is what gives the power."}, {"q": "Why is it better to use sudo than to stay logged in as root?", "o": ["sudo makes commands run faster", "Each command is a deliberate choice and is logged with your name", "root cannot read log files"], "c": 1, "why": "Deliberate, audited, least privilege."}, {"q": "Where are password hashes stored?", "o": ["/etc/passwd", "/etc/shadow", "/home/tech/.passwd"], "c": 1, "why": "/etc/passwd only has an x placeholder. /etc/shadow is root-only."}, {"q": "On Ubuntu, which group membership lets a user run sudo?", "o": ["adm", "sudo", "wheel"], "c": 1, "why": "Ubuntu uses the sudo group. Red Hat systems traditionally use wheel."}]}, {"id": "w3d2", "title": "File permissions", "min": 30, "goal": "Read any permission string, set the right mode with chmod, and know why SSH keys must be 600.", "learn": "<p><code>ls -l<\/code> shows a 10-character mode string:<\/p>\n<pre><code>-rwxr-x---  1 tech adm  1617 Oct 20 09:14 healthcheck.sh\n<\/code><\/pre>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Characters<\/th>\n<th>Who<\/th>\n<th>Here<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>-<\/code><\/td>\n<td>type (<code>-<\/code> file, <code>d<\/code> dir, <code>l<\/code> link)<\/td>\n<td>regular file<\/td>\n<\/tr>\n<tr>\n<td><code>rwx<\/code><\/td>\n<td><strong>user<\/strong> (owner: tech)<\/td>\n<td>read, write, execute<\/td>\n<\/tr>\n<tr>\n<td><code>r-x<\/code><\/td>\n<td><strong>group<\/strong> (adm)<\/td>\n<td>read, execute<\/td>\n<\/tr>\n<tr>\n<td><code>---<\/code><\/td>\n<td><strong>others<\/strong> (everyone else)<\/td>\n<td>nothing<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>What r, w, x mean<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>On a file<\/th>\n<th>On a directory<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>r<\/code><\/td>\n<td>Read the contents<\/td>\n<td>List the names inside<\/td>\n<\/tr>\n<tr>\n<td><code>w<\/code><\/td>\n<td>Change the contents<\/td>\n<td>Create, delete, rename files inside<\/td>\n<\/tr>\n<tr>\n<td><code>x<\/code><\/td>\n<td>Run it as a program<\/td>\n<td>Enter it (<code>cd<\/code>) and reach files inside<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Octal numbers<\/h2>\n<p>Each permission has a value: <strong>r = 4, w = 2, x = 1<\/strong>. Add them per group:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>String<\/th>\n<th>Typical use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>644<\/code><\/td>\n<td><code>rw-r--r--<\/code><\/td>\n<td>Normal files<\/td>\n<\/tr>\n<tr>\n<td><code>755<\/code><\/td>\n<td><code>rwxr-xr-x<\/code><\/td>\n<td>Scripts, programs, directories<\/td>\n<\/tr>\n<tr>\n<td><code>600<\/code><\/td>\n<td><code>rw-------<\/code><\/td>\n<td>Private files: <strong>SSH private keys<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>700<\/code><\/td>\n<td><code>rwx------<\/code><\/td>\n<td>Private directories: <code>~/.ssh<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>640<\/code><\/td>\n<td><code>rw-r-----<\/code><\/td>\n<td>Logs readable by a group (adm)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>chmod and chown<\/h2>\n<pre><code>chmod 755 script.sh        # set exactly\nchmod +x script.sh         # add execute for everyone\nchmod u+x,go-w file        # symbolic: user +x, group/others -w\nsudo chown tech:tech file  # change owner and group (needs root)\nchmod -R 755 folder        # recursive (be careful)\n<\/code><\/pre>\n<h2>Why it matters<\/h2>\n<ul>\n<li>A script without <code>x<\/code> gives <strong>Permission denied<\/strong> when you run <code>./script.sh<\/code>.<\/li>\n<li>SSH refuses to use a private key that others can read. Fix: <code>chmod 600 ~/.ssh/id_ed25519<\/code>.<\/li>\n<li>A world-writable config (<code>777<\/code>) is a security hole. \"Fixing\" access problems with <code>chmod 777<\/code> is a red flag in an interview.<\/li>\n<\/ul>", "lab": "<p>In your VM:<\/p>\n<pre><code>touch secret.txt\nls -l secret.txt\nchmod 600 secret.txt; ls -l secret.txt\necho 'echo hello from a script' &gt; hi.sh\n./hi.sh            # Permission denied\nchmod +x hi.sh\n./hi.sh\nls -ld ~/.ssh\n<\/code><\/pre>", "term": {"intro": "Fix permissions on dc-lab-07's health-check script.", "tasks": [{"p": "Look at the permissions in the scripts folder", "c": {"t": "re", "v": "^ls\\s+-\\w*l\\w*\\s+(~/|/home/tech/)?scripts/?$"}, "h": "ls -l scripts"}, {"p": "Try to run the health check", "c": {"t": "any", "v": "^\\./scripts/healthcheck\\.sh$"}, "h": "./scripts/healthcheck.sh"}, {"p": "Make it executable", "c": {"t": "exec", "v": "/home/tech/scripts/healthcheck.sh"}, "h": "chmod +x scripts/healthcheck.sh"}, {"p": "Run it again (it reports problems on purpose)", "c": {"t": "any", "v": "^\\./scripts/healthcheck\\.sh$"}, "h": "./scripts/healthcheck.sh"}, {"p": "Create lab/secret.txt and make it readable only by you", "c": {"t": "mode", "v": "/home/tech/lab/secret.txt=600"}, "h": "touch lab/secret.txt && chmod 600 lab/secret.txt"}, {"p": "Check the permissions on your .ssh folder", "c": {"t": "re", "v": "^ls\\s+-\\w*l\\w*\\s+(~/|/home/tech/)?\\.ssh/?$|^ls\\s+-\\w*d\\w*\\s+(~/|/home/tech/)?\\.ssh/?$"}, "h": "ls -la ~/.ssh"}]}, "quiz": [{"q": "What does mode 755 look like?", "o": ["rw-r--r--", "rwxr-xr-x", "rwx------"], "c": 1, "why": "7 = 4+2+1 (rwx), 5 = 4+1 (r-x)."}, {"q": "A log file is <code>-rw-r----- root adm<\/code>. You are in group adm. Can you read it?", "o": ["Yes, the group has r", "No, only root can", "Only with sudo"], "c": 0, "why": "The middle rwx triple is for the group, and it has r."}, {"q": "What mode should an SSH private key have?", "o": ["644", "755", "600"], "c": 2, "why": "Owner read/write only. SSH refuses keys others can read."}, {"q": "<code>./run.sh<\/code> says Permission denied but <code>cat run.sh<\/code> works. What's missing?", "o": ["Read permission", "Execute permission", "The shebang line"], "c": 1, "why": "You can read it, but without x you can't run it as a program."}, {"q": "A colleague suggests <code>chmod -R 777 /var/log<\/code> to fix an access error. Best response?", "o": ["Do it, it's quick", "Don't: it makes everything world-writable. Find which user or group actually needs access", "Use 666 instead"], "c": 1, "why": "777 removes all protection. Fix the specific owner, group or mode instead."}]}, {"id": "w3d3", "title": "Links, inodes and file types", "min": 20, "goal": "Recognise links and special files, and understand why some \"files\" point somewhere else.", "learn": "<p>The first character of <code>ls -l<\/code> tells you the file type:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Char<\/th>\n<th>Type<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>-<\/code><\/td>\n<td>Regular file<\/td>\n<td><code>notes.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>d<\/code><\/td>\n<td>Directory<\/td>\n<td><code>/var/log<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>l<\/code><\/td>\n<td>Symbolic link<\/td>\n<td><code>/etc/resolv.conf -&gt; ../run/...<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>b<\/code><\/td>\n<td>Block device (disk)<\/td>\n<td><code>/dev/sda<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>c<\/code><\/td>\n<td>Character device<\/td>\n<td><code>/dev/null<\/code>, <code>/dev/ipmi0<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Inodes<\/h2>\n<p>On disk, a file's data and details (owner, mode, size, where the blocks are) live in an <strong>inode<\/strong>. The name you see is just an entry pointing to an inode. <code>ls -i<\/code> shows inode numbers. A filesystem can run out of inodes before it runs out of space: <code>df -i<\/code> checks that (week 9).<\/p>\n<h2>Hard links vs symbolic links<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Hard link (<code>ln a b<\/code>)<\/th>\n<th>Symbolic link (<code>ln -s a b<\/code>)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What it is<\/td>\n<td>A second name for the <strong>same inode<\/strong><\/td>\n<td>A small file containing a <strong>path<\/strong><\/td>\n<\/tr>\n<tr>\n<td>If the original is deleted<\/td>\n<td>Data survives<\/td>\n<td>Link breaks (\"dangling\")<\/td>\n<\/tr>\n<tr>\n<td>Across filesystems<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>For directories<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Symlinks are everywhere on Ubuntu:<\/p>\n<ul>\n<li><code>/bin -&gt; usr/bin<\/code><\/li>\n<li><code>/etc/resolv.conf -&gt; ../run/systemd/resolve/stub-resolv.conf<\/code><\/li>\n<li><code>/boot/vmlinuz -&gt; vmlinuz-6.8.0-45-generic<\/code> (the current kernel)<\/li>\n<\/ul>\n<p><code>readlink -f path<\/code> shows where a link finally points. <code>file path<\/code> and <code>stat path<\/code> tell you more about anything.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>ls -l / | grep -- '-&gt;'\nls -l /etc/resolv.conf\nreadlink -f /etc/resolv.conf\necho data &gt; original.txt\nln original.txt hard.txt\nln -s original.txt soft.txt\nls -li original.txt hard.txt soft.txt\nrm original.txt\ncat hard.txt; cat soft.txt\n<\/code><\/pre>\n<p>The hard link still works, the symlink is broken.<\/p>", "term": {"intro": "Spot links and special files on dc-lab-07.", "tasks": [{"p": "Look at where /etc/resolv.conf points", "c": {"t": "re", "v": "^ls\\s+-\\w*l\\w*\\s+/etc/resolv\\.conf$"}, "h": "ls -l /etc/resolv.conf"}, {"p": "List / in long format and find the links", "c": {"t": "re", "v": "^ls\\s+-\\w*l\\w*\\s+/$"}, "h": "ls -l /"}, {"p": "Make a shortcut ~/lab/logs pointing to /var/log", "c": {"t": "exists", "v": "/home/tech/lab/logs"}, "h": "ln -s /var/log lab/logs"}, {"p": "List the logs through your new link", "c": {"t": "re", "v": "^ls\\s+(-\\w+\\s+)*(~/|/home/tech/)?lab/logs/?$"}, "h": "ls lab/logs/"}, {"p": "Check what kind of thing /dev/sda is", "c": {"t": "re", "v": "^(file|ls\\s+-\\w*l\\w*|stat)\\s+/dev/sda$"}, "h": "file /dev/sda"}]}, "quiz": [{"q": "In <code>ls -l<\/code>, a line starts with <code>b<\/code>. What is it?", "o": ["A backup file", "A block device such as a disk", "A broken link"], "c": 1, "why": "b = block device. Disks and partitions appear like this in /dev."}, {"q": "You delete the original file. Which link still shows the data?", "o": ["The hard link", "The symbolic link", "Neither"], "c": 0, "why": "A hard link points at the inode, which survives while any name points to it."}, {"q": "What is /bin on modern Ubuntu?", "o": ["A folder with copies of every program", "A symbolic link to usr/bin", "A device file"], "c": 1, "why": "Ubuntu merged /bin into /usr/bin and kept /bin as a symlink."}]}, {"id": "w3d4", "title": "Installing software with apt", "min": 25, "goal": "Install, find and remove the tools you need, and know how this works in a managed fleet.", "learn": "<p>Software on Linux comes in <strong>packages<\/strong>, downloaded from <strong>repositories<\/strong>. On Ubuntu the tool is <code>apt<\/code>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Command<\/th>\n<th>Does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>sudo apt update<\/code><\/td>\n<td>Refresh the list of available packages (installs nothing)<\/td>\n<\/tr>\n<tr>\n<td><code>sudo apt upgrade<\/code><\/td>\n<td>Install newer versions of what you have<\/td>\n<\/tr>\n<tr>\n<td><code>sudo apt install pkg<\/code><\/td>\n<td>Install a package<\/td>\n<\/tr>\n<tr>\n<td><code>sudo apt remove pkg<\/code><\/td>\n<td>Remove it<\/td>\n<\/tr>\n<tr>\n<td><code>apt search word<\/code><\/td>\n<td>Find packages<\/td>\n<\/tr>\n<tr>\n<td><code>apt show pkg<\/code><\/td>\n<td>Details about a package<\/td>\n<\/tr>\n<tr>\n<td><code>apt list --installed<\/code><\/td>\n<td>Everything installed<\/td>\n<\/tr>\n<tr>\n<td><code>dpkg -l | grep pkg<\/code><\/td>\n<td>Is this package installed?<\/td>\n<\/tr>\n<tr>\n<td><code>which cmd<\/code><\/td>\n<td>Where is this command?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>On Red Hat systems the same jobs use <code>dnf install<\/code>, <code>dnf search<\/code>, <code>rpm -qa<\/code>.<\/p>\n<p>If you type a command that isn't installed, Ubuntu often tells you the package:<\/p>\n<pre><code>Command 'tree' not found, but can be installed with:\nsudo apt install tree\n<\/code><\/pre>\n<h2>Tools a datacenter tech uses<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Package<\/th>\n<th>Gives you<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>smartmontools<\/code><\/td>\n<td><code>smartctl<\/code> disk health<\/td>\n<\/tr>\n<tr>\n<td><code>nvme-cli<\/code><\/td>\n<td><code>nvme<\/code> for NVMe drives<\/td>\n<\/tr>\n<tr>\n<td><code>ipmitool<\/code><\/td>\n<td>Talk to the BMC<\/td>\n<\/tr>\n<tr>\n<td><code>ethtool<\/code><\/td>\n<td>NIC speed, counters, optics<\/td>\n<\/tr>\n<tr>\n<td><code>lshw<\/code>, <code>pciutils<\/code><\/td>\n<td><code>lshw<\/code>, <code>lspci<\/code> hardware lists<\/td>\n<\/tr>\n<tr>\n<td><code>lldpd<\/code><\/td>\n<td><code>lldpctl<\/code>: which switch port am I on<\/td>\n<\/tr>\n<tr>\n<td><code>mtr-tiny<\/code>, <code>traceroute<\/code><\/td>\n<td>Network path testing<\/td>\n<\/tr>\n<tr>\n<td><code>rasdaemon<\/code><\/td>\n<td>Memory and PCIe error logging<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>In a real fleet<\/h2>\n<p>At scale, servers are built from standard images, and software changes are rolled out by automation, not typed by hand. Installing packages on a production machine usually needs approval. Saying that in an interview shows you understand operating at scale.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>tree                       # not found?\nsudo apt install -y tree\ntree -L 2 /etc | head -n 20\napt show smartmontools\ndpkg -l | grep -E &quot;smartmontools|ipmitool&quot;\nwhich smartctl\n<\/code><\/pre>", "term": {"intro": "Install a tool on dc-lab-07.", "tasks": [{"p": "Try to run tree", "c": {"t": "fail", "v": "^tree"}, "h": "tree"}, {"p": "Try to install it without sudo", "c": {"t": "fail", "v": "^apt(-get)?\\s+install\\s+tree$"}, "h": "apt install tree"}, {"p": "Refresh the package lists", "c": {"t": "re", "v": "^sudo\\s+apt(-get)?\\s+update$"}, "h": "sudo apt update"}, {"p": "Install tree with sudo", "c": {"t": "re", "v": "^sudo\\s+apt(-get)?\\s+install\\s+(-y\\s+)?tree$"}, "h": "sudo apt install tree"}, {"p": "Show your home folder as a tree", "c": {"t": "re", "v": "^tree(\\s+.*)?$"}, "h": "tree ~"}, {"p": "Find where smartctl lives", "c": {"t": "re", "v": "^which\\s+smartctl$"}, "h": "which smartctl"}]}, "quiz": [{"q": "What does <code>sudo apt update<\/code> do?", "o": ["Upgrades every package", "Refreshes the list of available packages", "Updates the kernel"], "c": 1, "why": "update refreshes lists. upgrade actually installs newer versions."}, {"q": "Which package provides smartctl?", "o": ["smartctl", "smartmontools", "disktools"], "c": 1, "why": "smartmontools provides smartctl and the smartd monitoring daemon."}, {"q": "How do you check if ipmitool is installed?", "o": ["apt install ipmitool", "dpkg -l | grep ipmitool", "ipmitool --install"], "c": 1, "why": "dpkg -l lists installed packages."}, {"q": "Why might you NOT install a package on a production server even with sudo?", "o": ["Changes on production usually go through approved automation or change control", "apt doesn't work on servers", "Packages are only for desktops"], "c": 0, "why": "At scale, consistency matters. Ad-hoc changes cause drift between machines."}]}, {"id": "w3d5", "title": "Editing files: nano and vim survival", "min": 25, "goal": "Open, change, save and quit a file in nano and in vim without panicking.", "learn": "<p>Sooner or later you'll need to edit a config file in a terminal. Two editors matter:<\/p>\n<h2>nano: easy<\/h2>\n<p><code>nano file<\/code> opens the file. Shortcuts are shown at the bottom, where <code>^<\/code> means Ctrl.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Keys<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ctrl+O, Enter<\/td>\n<td>Save (\"write Out\")<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+X<\/td>\n<td>Exit<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+W<\/td>\n<td>Search<\/td>\n<\/tr>\n<tr>\n<td>Ctrl+K / Ctrl+U<\/td>\n<td>Cut line / paste<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>vim: everywhere<\/h2>\n<p><code>vi<\/code>/<code>vim<\/code> is installed on almost every Unix system, including rescue and minimal environments where nano is missing. You only need survival skills.<\/p>\n<p>vim has <strong>modes<\/strong>. It opens in <strong>normal mode<\/strong>, where keys are commands, not text.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Keys<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>i<\/code><\/td>\n<td>Insert mode: now you can type<\/td>\n<\/tr>\n<tr>\n<td><code>Esc<\/code><\/td>\n<td>Back to normal mode<\/td>\n<\/tr>\n<tr>\n<td><code>:w<\/code> Enter<\/td>\n<td>Save<\/td>\n<\/tr>\n<tr>\n<td><code>:q<\/code> Enter<\/td>\n<td>Quit<\/td>\n<\/tr>\n<tr>\n<td><code>:wq<\/code> Enter<\/td>\n<td>Save and quit<\/td>\n<\/tr>\n<tr>\n<td><code>:q!<\/code> Enter<\/td>\n<td><strong>Quit without saving<\/strong> (your escape hatch)<\/td>\n<\/tr>\n<tr>\n<td><code>/word<\/code><\/td>\n<td>Search, <code>n<\/code> for next<\/td>\n<\/tr>\n<tr>\n<td><code>dd<\/code><\/td>\n<td>Delete line<\/td>\n<\/tr>\n<tr>\n<td><code>u<\/code><\/td>\n<td>Undo<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Stuck in vim? Press Esc a few times, then type <code>:q!<\/code> and Enter.<\/p>\n<h2>Safe editing habits<\/h2>\n<ol>\n<li><strong>Back up first:<\/strong> <code>sudo cp /etc/fstab /etc/fstab.bak<\/code><\/li>\n<li>Edit with <code>sudo nano /etc/fstab<\/code> (or <code>sudoedit<\/code>).<\/li>\n<li><strong>Check before you reboot.<\/strong> For fstab: <code>sudo findmnt --verify<\/code>. A broken fstab can stop a server from booting.<\/li>\n<li>Note the change in the ticket.<\/li>\n<\/ol>", "lab": "<p>In your VM, do both:<\/p>\n<pre><code>nano hello.txt          # type a line, Ctrl+O, Enter, Ctrl+X\ncat hello.txt\nvimtutor                # do lessons 1.1 to 1.6, about 15 minutes\n<\/code><\/pre>\n<p><code>vimtutor<\/code> is the best way to learn vim. Come back to it once a week until <code>i<\/code>, <code>Esc<\/code>, <code>:wq<\/code> and <code>:q!<\/code> are automatic.<\/p>", "term": {"intro": "The practice terminal can't open full-screen editors, so here you edit files the script way.", "tasks": [{"p": "See what happens if you try to open nano", "c": {"t": "any", "v": "^(nano|vim?)\\s"}, "h": "nano lab/test.txt"}, {"p": "Back up /etc/hosts into your lab folder", "c": {"t": "exists", "v": "/home/tech/lab/hosts.bak"}, "h": "cp /etc/hosts lab/hosts.bak"}, {"p": "Append a new host line to the backup copy", "c": {"t": "re", "v": "^echo\\s+['\"]?10\\.20\\.7\\.19\\s+dc-lab-09['\"]?\\s*>>\\s*(~/|/home/tech/)?lab/hosts\\.bak$"}, "h": "echo \"10.20.7.19 dc-lab-09\" >> lab/hosts.bak"}, {"p": "Check the last 2 lines of the copy", "c": {"t": "re", "v": "^tail\\s+(-n\\s*2|-2)\\s+(~/|/home/tech/)?lab/hosts\\.bak$"}, "h": "tail -n 2 lab/hosts.bak"}]}, "quiz": [{"q": "You're in vim and want to leave without saving anything. What do you type?", "o": ["Ctrl+X", ":wq", "Esc, then :q!"], "c": 2, "why": ":q! quits and discards changes. Esc first makes sure you're in normal mode."}, {"q": "In vim you press keys but nothing appears in the file. Why?", "o": ["You're in normal mode; press i to insert", "vim is read-only for normal users", "The file is too big"], "c": 0, "why": "vim starts in normal mode, where keys are commands."}, {"q": "In nano, how do you save?", "o": ["Ctrl+S", "Ctrl+O then Enter", ":w"], "c": 1, "why": "Ctrl+O writes the file out. Ctrl+X exits."}, {"q": "What should you do before editing /etc/fstab?", "o": ["Make a backup copy", "Reboot the server", "chmod 777 it so you can save"], "c": 0, "why": "A backup lets you roll back. A broken fstab can stop the server booting."}]}]}, {"n": 4, "title": "Processes, services and logs", "summary": "What's running, how services are managed with systemd, where logs live, what the kernel is telling you, and how a server boots.", "lessons": [{"id": "w4d1", "title": "Processes", "min": 25, "goal": "See what's running, spot what's eating resources, and stop a process the right way.", "learn": "<p>A <strong>process<\/strong> is a running program. Each has a <strong>PID<\/strong> (process ID) and a parent (PPID). PID 1 is <code>systemd<\/code>, which starts everything else.<\/p>\n<h2>ps: a snapshot<\/h2>\n<pre><code>ps aux | head\nps aux --sort=-%cpu | head -n 5     # biggest CPU users\nps aux | grep collector\npgrep -a collector                   # PIDs + command lines\n<\/code><\/pre>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Column<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>USER<\/td>\n<td>Who runs it<\/td>\n<\/tr>\n<tr>\n<td>PID<\/td>\n<td>Process ID<\/td>\n<\/tr>\n<tr>\n<td>%CPU / %MEM<\/td>\n<td>Share of CPU / memory<\/td>\n<\/tr>\n<tr>\n<td>RSS<\/td>\n<td>Real memory used (KB)<\/td>\n<\/tr>\n<tr>\n<td>STAT<\/td>\n<td>State, see below<\/td>\n<\/tr>\n<tr>\n<td>START / TIME<\/td>\n<td>Start time / CPU time used<\/td>\n<\/tr>\n<tr>\n<td>COMMAND<\/td>\n<td>What it is<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>STAT<\/th>\n<th>Means<\/th>\n<th>Why you care<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>R<\/code><\/td>\n<td>Running<\/td>\n<td>Busy<\/td>\n<\/tr>\n<tr>\n<td><code>S<\/code><\/td>\n<td>Sleeping (waiting)<\/td>\n<td>Normal<\/td>\n<\/tr>\n<tr>\n<td><code>D<\/code><\/td>\n<td>Uninterruptible sleep, usually waiting on disk I/O<\/td>\n<td>Many stuck <code>D<\/code> processes often point at storage or hardware trouble<\/td>\n<\/tr>\n<tr>\n<td><code>Z<\/code><\/td>\n<td>Zombie (finished, parent hasn't cleaned up)<\/td>\n<td>Usually harmless in small numbers<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>top / htop: live view<\/h2>\n<p><code>top<\/code> refreshes every few seconds. Keys: <code>P<\/code> sort by CPU, <code>M<\/code> by memory, <code>1<\/code> show every CPU, <code>k<\/code> kill, <code>q<\/code> quit. <code>htop<\/code> is a friendlier version.<\/p>\n<h2>Load average<\/h2>\n<p><code>uptime<\/code> shows three numbers, e.g. <code>3.08, 2.95, 2.71<\/code>: the average number of processes running or waiting over 1, 5 and 15 minutes. Compare it with the CPU count (<code>nproc<\/code>). dc-lab-07 has 224 CPUs, so a load of 3 is nothing. On a 4-CPU machine, a load of 12 means a queue.<\/p>\n<h2>Stopping processes<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Command<\/th>\n<th>Signal<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>kill PID<\/code><\/td>\n<td>SIGTERM (15)<\/td>\n<td>\"Please stop\": the program can clean up<\/td>\n<\/tr>\n<tr>\n<td><code>kill -9 PID<\/code><\/td>\n<td>SIGKILL (9)<\/td>\n<td>Forced stop, no cleanup. Last resort<\/td>\n<\/tr>\n<tr>\n<td><code>pkill name<\/code><\/td>\n<td>SIGTERM<\/td>\n<td>By name<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>You can only signal your own processes unless you use sudo. For anything that is a <strong>service<\/strong>, use <code>systemctl stop<\/code> instead (next lesson), so systemd knows it was intentional. On production, don't kill other teams' processes without the ticket saying so.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>ps aux | wc -l\nps aux --sort=-%mem | head -n 5\nsleep 300 &amp;\npgrep -a sleep\nkill $(pgrep sleep)\npgrep -a sleep\ntop                     # press P, M, 1, then q\n<\/code><\/pre>", "term": {"intro": "Look at what dc-lab-07 is doing.", "tasks": [{"p": "Show the first few processes", "c": {"t": "re", "v": "^ps\\s+(aux|-ef)\\s*\\|\\s*head"}, "h": "ps aux | head -n 5"}, {"p": "List the biggest CPU users first", "c": {"t": "re", "v": "^ps\\s+aux\\s+--sort=-%cpu"}, "h": "ps aux --sort=-%cpu | head -n 5"}, {"p": "Find collector's PID by name", "c": {"t": "re", "v": "^(pgrep\\s+(-\\w+\\s+)*collector|pidof\\s+collector|ps\\s+aux\\s*\\|\\s*grep\\s+collector)$"}, "h": "pgrep -a collector"}, {"p": "Open top", "c": {"t": "re", "v": "^h?top$"}, "h": "top"}, {"p": "Compare the load average with the CPU count", "c": {"t": "re", "v": "^nproc$"}, "h": "uptime, then: nproc"}, {"p": "Try to kill collector as yourself (you shouldn't be able to)", "c": {"t": "fail", "v": "^kill\\s+48211$"}, "h": "kill 48211"}]}, "quiz": [{"q": "Several processes are stuck in state D. What does that usually point to?", "o": ["Waiting on disk or other I/O, possibly a storage or hardware problem", "They are zombies", "They are using too much CPU"], "c": 0, "why": "D = uninterruptible sleep, typically on I/O. Lots of D processes deserves a look at disks and dmesg."}, {"q": "Load average is 3.0 on a server with 224 CPUs. Is the server overloaded?", "o": ["Yes, anything over 1.0 is overloaded", "No, the load is tiny compared with the number of CPUs", "Can't tell without rebooting"], "c": 1, "why": "Compare load with nproc."}, {"q": "Which signal does plain <code>kill PID<\/code> send?", "o": ["SIGKILL (9)", "SIGTERM (15)", "SIGHUP (1)"], "c": 1, "why": "SIGTERM asks the process to exit cleanly. -9 forces it."}, {"q": "The process you want to stop is the sshd service. What's the better tool?", "o": ["kill -9", "sudo systemctl stop ssh", "pkill -9 sshd"], "c": 1, "why": "Services should be controlled through systemd so it knows the state is intentional."}]}, {"id": "w4d2", "title": "Services with systemd", "min": 25, "goal": "Check, start, stop and enable services, and read a <code>systemctl status<\/code> screen like a pro.", "learn": "<p><strong>systemd<\/strong> (PID 1) starts and supervises <strong>units<\/strong>. Most units you care about are <strong>services<\/strong>: background programs like <code>ssh<\/code>, <code>smartd<\/code> or <code>nvidia-fabricmanager<\/code>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Command<\/th>\n<th>Does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>systemctl status ssh<\/code><\/td>\n<td>Is it running? Since when? Recent log lines<\/td>\n<\/tr>\n<tr>\n<td><code>sudo systemctl start ssh<\/code><\/td>\n<td>Start it now<\/td>\n<\/tr>\n<tr>\n<td><code>sudo systemctl stop ssh<\/code><\/td>\n<td>Stop it now<\/td>\n<\/tr>\n<tr>\n<td><code>sudo systemctl restart ssh<\/code><\/td>\n<td>Stop + start<\/td>\n<\/tr>\n<tr>\n<td><code>sudo systemctl enable ssh<\/code><\/td>\n<td>Start automatically at boot<\/td>\n<\/tr>\n<tr>\n<td><code>sudo systemctl disable ssh<\/code><\/td>\n<td>Don't start at boot<\/td>\n<\/tr>\n<tr>\n<td><code>systemctl is-active ssh<\/code><\/td>\n<td>Just \"active\" or not, good for scripts<\/td>\n<\/tr>\n<tr>\n<td><code>systemctl --failed<\/code><\/td>\n<td>Everything that failed. <strong>Run this on every health check<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>systemctl list-units --type=service<\/code><\/td>\n<td>All services<\/td>\n<\/tr>\n<tr>\n<td><code>systemctl cat ssh<\/code><\/td>\n<td>Show the unit file<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Reading <code>systemctl status<\/code><\/h2>\n<pre><code>× nvidia-fabricmanager.service - NVIDIA fabric manager service\n     Loaded: loaded (/usr/lib/systemd/system/nvidia-fabricmanager.service; enabled)\n     Active: failed (Result: exit-code) since Thu 2026-10-22 08:42:13 EEST\n   Main PID: 51877 (code=exited, status=1/FAILURE)\n\n... nv-fabricmanager[51877]: failed to find all the expected GPUs on the base board: expected 8, found 7.\n<\/code><\/pre>\n<ul>\n<li><strong>Loaded<\/strong> line: where the unit file is, and whether it starts at boot (<code>enabled<\/code>).<\/li>\n<li><strong>Active<\/strong> line: running, failed, or inactive, and since when.<\/li>\n<li><strong>Log lines<\/strong> at the bottom: often the answer is right there.<\/li>\n<\/ul>\n<h2>Unit files<\/h2>\n<p>Package unit files live in <code>/usr/lib/systemd/system/<\/code>. Local ones and overrides go in <code>/etc/systemd/system/<\/code>. After editing one, run <code>sudo systemctl daemon-reload<\/code>.<\/p>\n<h2>The key lesson<\/h2>\n<p>Restarting a service that failed because of <strong>hardware<\/strong> won't fix it. Fabric manager on dc-lab-07 fails because a GPU fell off the bus. The service is a symptom; the GPU is the cause. Read the log lines, find the cause, fix that.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>systemctl --failed\nsystemctl status ssh\nsystemctl is-active ssh\nsystemctl list-units --type=service | head -n 15\nsystemctl cat ssh | head -n 20\nsudo systemctl restart ssh &amp;&amp; systemctl status ssh | head -n 5\n<\/code><\/pre>", "term": {"intro": "Check dc-lab-07's services.", "tasks": [{"p": "List failed units", "c": {"t": "re", "v": "^systemctl\\s+(--failed|list-units\\s+--state=failed)$"}, "h": "systemctl --failed"}, {"p": "Read the status of the failed service", "c": {"t": "any", "v": "^(sudo\\s+)?systemctl\\s+status\\s+nvidia-fabricmanager(\\.service)?$"}, "h": "systemctl status nvidia-fabricmanager"}, {"p": "Check that ssh is healthy", "c": {"t": "re", "v": "^(sudo\\s+)?systemctl\\s+status\\s+(ssh|sshd)(\\.service)?$"}, "h": "systemctl status ssh"}, {"p": "Try restarting fabric manager with sudo and read why it fails", "c": {"t": "any", "v": "^sudo\\s+systemctl\\s+restart\\s+nvidia-fabricmanager"}, "h": "sudo systemctl restart nvidia-fabricmanager"}, {"p": "Show the unit file of the collector service", "c": {"t": "re", "v": "^(sudo\\s+)?systemctl\\s+cat\\s+collector(\\.service)?$"}, "h": "systemctl cat collector"}, {"p": "Ask if ssh is active, script style", "c": {"t": "re", "v": "^systemctl\\s+is-active\\s+(ssh|sshd)(\\.service)?$"}, "h": "systemctl is-active ssh"}]}, "quiz": [{"q": "Which command lists every unit that failed?", "o": ["systemctl --failed", "systemctl status", "journalctl --failed"], "c": 0, "why": "systemctl --failed (or list-units --state=failed)."}, {"q": "What's the difference between <code>start<\/code> and <code>enable<\/code>?", "o": ["They do the same thing", "start runs it now; enable makes it start at boot", "enable runs it now; start makes it start at boot"], "c": 1, "why": "Often you want both: sudo systemctl enable --now service."}, {"q": "You edited a unit file in /etc/systemd/system. What must you run before restarting the service?", "o": ["sudo reboot", "sudo systemctl daemon-reload", "sudo apt update"], "c": 1, "why": "daemon-reload makes systemd re-read unit files."}, {"q": "Fabric manager fails with \"expected 8 GPUs, found 7\". What do you do?", "o": ["Restart it until it works", "Treat it as a symptom: investigate the missing GPU", "Disable the service"], "c": 1, "why": "The service needs all GPUs. Fix the hardware cause."}]}, {"id": "w4d3", "title": "Reading logs: journalctl and /var/log", "min": 30, "goal": "Pull exactly the log lines you need: by service, by time, by severity, by boot.", "learn": "<p>Ubuntu keeps logs in two places at once:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>System<\/th>\n<th>Where<\/th>\n<th>Read with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>journald<\/strong><\/td>\n<td>Binary journal<\/td>\n<td><code>journalctl<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>rsyslog<\/strong><\/td>\n<td>Text files in <code>/var/log<\/code><\/td>\n<td><code>less<\/code>, <code>grep<\/code>, <code>tail<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Key text logs: <code>/var/log/syslog<\/code> (everything), <code>/var/log/kern.log<\/code> (kernel), <code>/var/log/auth.log<\/code> (logins, sudo).<\/p>\n<h2>journalctl filters<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>-u smartd<\/code><\/td>\n<td>One service<\/td>\n<\/tr>\n<tr>\n<td><code>-b<\/code><\/td>\n<td>This boot. <code>-b -1<\/code> = previous boot<\/td>\n<\/tr>\n<tr>\n<td><code>-k<\/code><\/td>\n<td>Kernel messages<\/td>\n<\/tr>\n<tr>\n<td><code>-p err<\/code><\/td>\n<td>Priority err and worse<\/td>\n<\/tr>\n<tr>\n<td><code>--since \"1 hour ago\"<\/code><\/td>\n<td>Time window. Also <code>--since \"2026-10-22 08:00\"<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>-n 50<\/code><\/td>\n<td>Last 50 lines<\/td>\n<\/tr>\n<tr>\n<td><code>-r<\/code><\/td>\n<td>Newest first<\/td>\n<\/tr>\n<tr>\n<td><code>-f<\/code><\/td>\n<td>Follow live<\/td>\n<\/tr>\n<tr>\n<td><code>-g PATTERN<\/code><\/td>\n<td>Grep the message text<\/td>\n<\/tr>\n<tr>\n<td><code>--list-boots<\/code><\/td>\n<td>All recorded boots<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Combine them: <code>journalctl -u nvidia-fabricmanager -p err --since today<\/code>.<\/p>\n<h2>Priorities<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Number<\/th>\n<th>Name<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>emerg<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>alert<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>crit<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>err<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>warning<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>notice<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>info<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>debug<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>-p err<\/code> shows 0 to 3.<\/p>\n<h2>Rotation<\/h2>\n<p>Logs are rotated so they don't fill the disk: <code>syslog<\/code> → <code>syslog.1<\/code> → <code>syslog.2.gz<\/code>. Read compressed ones with <code>zcat<\/code>, <code>zgrep<\/code> or <code>zless<\/code>.<\/p>\n<h2>How to work an incident<\/h2>\n<ol>\n<li>Get the <strong>time<\/strong> of the incident from the ticket or monitoring.<\/li>\n<li>Look at that window: <code>journalctl --since \"08:20\" --until \"08:35\"<\/code>.<\/li>\n<li>Narrow by service or kernel: <code>-u<\/code> or <code>-k<\/code>.<\/li>\n<li>Widen if needed: what happened just before?<\/li>\n<\/ol>\n<p>Watch for <strong>time zones<\/strong>: server logs here are in local time (EEST, UTC+3), but a BMC's event log or a vendor tool may use UTC. Always note which one you're reading.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>journalctl -b -p warning | tail -n 20\njournalctl -u ssh --since &quot;1 hour ago&quot;\njournalctl --list-boots\nsudo tail -n 20 /var/log/auth.log\nls /var/log/*.gz 2&gt;/dev/null\n<\/code><\/pre>", "term": {"intro": "Find the important lines on dc-lab-07.", "tasks": [{"p": "Show errors (and worse) from this boot", "c": {"t": "re", "v": "^journalctl\\s+(-\\w+\\s+)*(-p\\s*err|--priority=err)(\\s+-b)?(\\s.*)?$"}, "h": "journalctl -p err -b"}, {"p": "Show the smartd service log", "c": {"t": "re", "v": "^journalctl\\s+(-\\w+\\s+)*-u\\s*smartd(\\.service)?(\\s.*)?$"}, "h": "journalctl -u smartd"}, {"p": "Find the GPU Xid message in the kernel log via journalctl", "c": {"t": "re", "v": "^journalctl\\s+.*-k.*-g\\s*['\"]?[Xx]id|^journalctl\\s+.*-g\\s*['\"]?[Xx]id.*-k"}, "h": "journalctl -k -g Xid"}, {"p": "Show what happened in the last hour", "c": {"t": "re", "v": "^journalctl\\s+.*--since\\s+['\"]1 hour ago['\"]"}, "h": "journalctl --since \"1 hour ago\""}, {"p": "List the recorded boots", "c": {"t": "re", "v": "^journalctl\\s+--list-boots$"}, "h": "journalctl --list-boots"}, {"p": "Grep the text syslog for failures, last 5", "c": {"t": "re", "v": "^grep\\s+(-\\w+\\s+)*['\"]?fail\\w*['\"]?\\s+/var/log/syslog\\s*\\|\\s*tail"}, "h": "grep -i fail /var/log/syslog | tail -n 5"}]}, "quiz": [{"q": "How do you see only one service's log lines?", "o": ["journalctl -u servicename", "journalctl -s servicename", "journalctl servicename"], "c": 0, "why": "-u stands for unit."}, {"q": "Which shows logs from the boot before the current one?", "o": ["journalctl -b", "journalctl -b -1", "journalctl --previous"], "c": 1, "why": "-b 0 (or -b) is this boot, -b -1 the previous."}, {"q": "<code>journalctl -p err<\/code> shows which priorities?", "o": ["Only err", "err, crit, alert and emerg (3 to 0)", "Everything except debug"], "c": 1, "why": "-p shows that level and everything more severe."}, {"q": "syslog.2.gz: how do you search it?", "o": ["grep can't read it, you must reboot", "zgrep pattern /var/log/syslog.2.gz", "cat it first, then grep"], "c": 1, "why": "zgrep, zcat and zless read compressed logs directly."}, {"q": "The ticket says the GPU failed at 08:27. The BMC log shows 05:27. Most likely?", "o": ["The BMC log is in UTC and the server in local time (UTC+3)", "The GPU failed twice", "One log is corrupt"], "c": 0, "why": "Always check the time zone of every log source."}]}, {"id": "w4d4", "title": "The kernel and dmesg", "min": 25, "goal": "Read the kernel's own messages and recognise which piece of hardware they're about.", "learn": "<p>The kernel keeps a <strong>ring buffer<\/strong> of its messages: drivers loading, devices detected, links going up and down, and hardware errors. <code>dmesg<\/code> prints it.<\/p>\n<p>On Ubuntu you need sudo: <code>sudo dmesg<\/code>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>-T<\/code><\/td>\n<td>Human-readable timestamps instead of seconds since boot<\/td>\n<\/tr>\n<tr>\n<td><code>-l err,warn<\/code><\/td>\n<td>Only these levels<\/td>\n<\/tr>\n<tr>\n<td><code>-w<\/code><\/td>\n<td>Wait for new messages (live)<\/td>\n<\/tr>\n<tr>\n<td><code>-x<\/code><\/td>\n<td>Show facility and level on each line<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre><code>sudo dmesg -T | tail -n 30\nsudo dmesg -T -l err\nsudo dmesg -T | grep -iE &quot;error|fail&quot;\nsudo dmesg -w          # while you reseat something\n<\/code><\/pre>\n<h2>Who is talking? Recognise the prefixes<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Message contains<\/th>\n<th>Subsystem<\/th>\n<th>Example meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>EDAC<\/code>, <code>MCE<\/code>, <code>mce:<\/code><\/td>\n<td>Memory / CPU machine checks<\/td>\n<td>Corrected or uncorrected memory errors<\/td>\n<\/tr>\n<tr>\n<td><code>sd 1:0:0:0: [sdb]<\/code>, <code>I/O error, dev sdb<\/code><\/td>\n<td>SCSI/SATA disk<\/td>\n<td>Read/write failures on a disk<\/td>\n<\/tr>\n<tr>\n<td><code>md/raid1:md0<\/code><\/td>\n<td>Software RAID<\/td>\n<td>A disk dropped out of an array<\/td>\n<\/tr>\n<tr>\n<td><code>nvme nvme0<\/code><\/td>\n<td>NVMe drive<\/td>\n<td>Timeouts, resets<\/td>\n<\/tr>\n<tr>\n<td><code>mlx5_core … ens1f0: Link down<\/code><\/td>\n<td>Mellanox NIC<\/td>\n<td>Port lost link<\/td>\n<\/tr>\n<tr>\n<td><code>NVRM: Xid<\/code><\/td>\n<td>NVIDIA GPU driver<\/td>\n<td>GPU error with an Xid code<\/td>\n<\/tr>\n<tr>\n<td><code>AER<\/code>, <code>pcieport<\/code><\/td>\n<td>PCIe bus<\/td>\n<td>Link errors between devices<\/td>\n<\/tr>\n<tr>\n<td><code>EXT4-fs error<\/code>, <code>XFS<\/code><\/td>\n<td>Filesystem<\/td>\n<td>Corruption, read-only remount<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The kernel's own time is \"seconds since boot\". <code>-T<\/code> converts it to wall-clock time. That's convenient but can drift slightly on long-running systems. For exact times, cross-check with <code>journalctl -k<\/code>, which stores real timestamps.<\/p>\n<h2>Kernel panics<\/h2>\n<p>If the kernel crashes (panics), the message goes to the <strong>console<\/strong>, not to the next boot's dmesg. That's why servers send their console to a serial port that you can watch through the BMC (Serial over LAN, week 5), and why <code>journalctl -b -1<\/code> (if the journal survived) or a crash-dump tool is used afterwards.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>sudo dmesg -T | head -n 20\nsudo dmesg -T -l err,warn\nsudo dmesg -T | grep -i -E &quot;eth|ens|enp&quot;\nsudo dmesg -x | tail\n<\/code><\/pre>\n<p>A VM has few hardware errors. The interesting output is on dc-lab-07.<\/p>", "term": {"intro": "Read what dc-lab-07's kernel has been saying.", "tasks": [{"p": "Try dmesg without sudo", "c": {"t": "fail", "v": "^dmesg$"}, "h": "dmesg"}, {"p": "Show the last kernel messages with readable times", "c": {"t": "re", "v": "^sudo\\s+dmesg\\s+-\\w*T\\w*.*\\|\\s*tail"}, "h": "sudo dmesg -T | tail -n 10"}, {"p": "Show only error-level messages", "c": {"t": "re", "v": "^sudo\\s+dmesg\\s+(-T\\s+)?(-l\\s*err|--level=err)(\\s+-T)?$"}, "h": "sudo dmesg -T -l err"}, {"p": "Find the memory (EDAC) errors", "c": {"t": "re", "v": "^sudo\\s+dmesg.*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?(edac|EDAC)"}, "h": "sudo dmesg -T | grep -i edac"}, {"p": "Find link events for ens1f0", "c": {"t": "re", "v": "^sudo\\s+dmesg.*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?ens1f0"}, "h": "sudo dmesg -T | grep ens1f0"}, {"p": "Find the GPU Xid error", "c": {"t": "re", "v": "^sudo\\s+dmesg.*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?(xid|Xid|XID)"}, "h": "sudo dmesg -T | grep -i xid"}]}, "quiz": [{"q": "<code>I/O error, dev sdb, sector 1953124<\/code> points at which component?", "o": ["Memory", "The disk sdb (or its cable/controller)", "The network card"], "c": 1, "why": "I/O error on dev sdb is a storage problem. Check SMART and the cable/backplane."}, {"q": "Which prefix means an NVIDIA GPU error?", "o": ["EDAC", "NVRM: Xid", "AER"], "c": 1, "why": "The NVIDIA driver logs NVRM: Xid <code>."}, {"q": "What does <code>dmesg -T<\/code> change?", "o": ["Shows human-readable timestamps", "Shows only today's messages", "Shows messages from the previous boot"], "c": 0, "why": "-T converts seconds-since-boot into dates and times."}, {"q": "A kernel panic crashed the server. Where would you most likely have seen the panic message live?", "o": ["In dmesg after reboot", "On the console, for example through the BMC's Serial over LAN", "In /var/log/auth.log"], "c": 1, "why": "The panic prints to the console. After reboot the ring buffer is new."}]}, {"id": "w4d5", "title": "How a server boots", "min": 25, "goal": "Know each boot stage and what a failure at that stage looks like, so you can say where a dead server is stuck.", "learn": "<h2>The boot chain<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th>What happens<\/th>\n<th>If it fails you see<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Power<\/td>\n<td>PSUs come up, BMC is already running on standby power<\/td>\n<td>No lights, PSU fault LED, BMC unreachable<\/td>\n<\/tr>\n<tr>\n<td>2. UEFI/BIOS POST<\/td>\n<td>CPUs initialise, <strong>memory training<\/strong>, PCIe devices enumerate<\/td>\n<td>Stuck POST code, beeps, \"memory training failed\", missing devices<\/td>\n<\/tr>\n<tr>\n<td>3. Boot device<\/td>\n<td>Firmware picks a boot device (disk, or PXE over network) from the boot order<\/td>\n<td>\"No bootable device\", PXE loops<\/td>\n<\/tr>\n<tr>\n<td>4. Bootloader (GRUB)<\/td>\n<td>Loads the kernel and initramfs from <code>/boot<\/code><\/td>\n<td><code>grub rescue&gt;<\/code> prompt<\/td>\n<\/tr>\n<tr>\n<td>5. Kernel + initramfs<\/td>\n<td>Drivers load, root filesystem found by UUID<\/td>\n<td>Kernel panic, \"cannot find root device\"<\/td>\n<\/tr>\n<tr>\n<td>6. systemd (PID 1)<\/td>\n<td>Mounts filesystems from <code>/etc/fstab<\/code>, starts services<\/td>\n<td>Emergency mode, failed units<\/td>\n<\/tr>\n<tr>\n<td>7. Target reached<\/td>\n<td><code>multi-user.target<\/code> on servers<\/td>\n<td>Login prompt / SSH works<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Seeing a boot you aren't standing in front of<\/h2>\n<ul>\n<li><strong>BMC Serial over LAN<\/strong> (<code>ipmitool sol activate<\/code>): shows the console text: POST messages, GRUB menu, kernel boot, login prompt. That's why servers boot with <code>console=ttyS1,115200n8<\/code> on the kernel command line (<code>cat /proc/cmdline<\/code>).<\/li>\n<li><strong>BMC POST codes and event log<\/strong>: where firmware got stuck, and hardware errors during POST.<\/li>\n<li><strong>After it's up:<\/strong> <code>journalctl -b<\/code> (this boot), <code>journalctl -b -1<\/code> (last boot), <code>last reboot<\/code>, <code>uptime -s<\/code>.<\/li>\n<\/ul>\n<h2>Two classic stuck states<\/h2>\n<ul>\n<li><strong>Emergency mode<\/strong> after a disk swap or fstab edit: a filesystem in <code>/etc/fstab<\/code> can't be mounted. Options like <code>nofail<\/code> stop non-critical disks from blocking boot.<\/li>\n<li><strong>Read-only root filesystem<\/strong>: ext4 with <code>errors=remount-ro<\/code> switches to read-only when it detects errors, to protect data. Writes fail with \"Read-only file system\". Check <code>dmesg<\/code> for the disk errors that caused it.<\/li>\n<\/ul>\n<p>Being able to say \"it's stuck in POST, so the OS can't be the problem yet\" is a typical L2 skill.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>cat /proc/cmdline\nsystemctl get-default\njournalctl -b | head -n 20\njournalctl --list-boots\nlast reboot | head\nsystemd-analyze\nsystemd-analyze blame | head\n<\/code><\/pre>\n<p><code>systemd-analyze<\/code> shows how long the boot took and which services were slowest.<\/p>", "term": {"intro": "Look at dc-lab-07's boot.", "tasks": [{"p": "Show the kernel command line (note the serial console)", "c": {"t": "re", "v": "^cat\\s+/proc/cmdline$"}, "h": "cat /proc/cmdline"}, {"p": "Show the default boot target", "c": {"t": "re", "v": "^systemctl\\s+get-default$"}, "h": "systemctl get-default"}, {"p": "List the recorded boots", "c": {"t": "re", "v": "^journalctl\\s+--list-boots$"}, "h": "journalctl --list-boots"}, {"p": "Read the end of the previous boot", "c": {"t": "re", "v": "^journalctl\\s+(-\\w+\\s+)*-b\\s*-1"}, "h": "journalctl -b -1"}, {"p": "Show when the system last rebooted", "c": {"t": "re", "v": "^(last\\s+reboot|who\\s+-b|uptime\\s+-s)$"}, "h": "last reboot"}]}, "quiz": [{"q": "Memory training happens during which stage?", "o": ["UEFI/BIOS POST", "GRUB", "systemd"], "c": 0, "why": "The firmware trains and tests memory before anything boots."}, {"q": "You get a <code>grub rescue&gt;<\/code> prompt. Which stage failed?", "o": ["POST", "The bootloader couldn't find its files or the kernel", "systemd"], "c": 1, "why": "GRUB is running but can't load what it needs, often a /boot or disk issue."}, {"q": "After a disk swap the server drops to emergency mode. First suspect?", "o": ["An /etc/fstab entry that can't be mounted", "A bad CPU", "The network cable"], "c": 0, "why": "systemd couldn't mount something it was told to. Check fstab and the new disk's UUID."}, {"q": "How can you watch a server boot remotely, from POST to login prompt?", "o": ["ssh into it", "Serial over LAN through the BMC", "journalctl -f"], "c": 1, "why": "SSH only works once the OS is up. SOL shows the console from the start."}]}]}, {"n": 5, "title": "Hardware through Linux", "summary": "Inventory a server from the shell, read memory and disk errors, understand filesystems and RAID, and use the BMC.", "lessons": [{"id": "w5d1", "title": "Hardware inventory from the command line", "min": 25, "goal": "List CPUs, memory, PCIe devices and disks, and pull serial numbers for an RMA without opening the case.", "learn": "<p>Before a repair you confirm what's in the box. After it, you confirm the new part is detected. You also need serial numbers for RMAs. All of that is a few commands away.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Command<\/th>\n<th>Shows<\/th>\n<th>sudo?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>lscpu<\/code><\/td>\n<td>CPU model, sockets, cores, threads, NUMA<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><code>nproc<\/code><\/td>\n<td>Number of CPUs<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><code>free -h<\/code><\/td>\n<td>Total and used memory<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><code>lspci<\/code><\/td>\n<td>Every PCIe device: GPUs, NICs, NVMe, RAID cards<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><code>lsblk -o NAME,SIZE,MODEL,SERIAL<\/code><\/td>\n<td>Disks with model and serial<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><code>sudo dmidecode -t system<\/code><\/td>\n<td>Server model and <strong>chassis serial<\/strong><\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><code>sudo dmidecode -t memory<\/code><\/td>\n<td>Every DIMM slot: size, speed, part number, <strong>serial<\/strong><\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><code>sudo dmidecode -s system-serial-number<\/code><\/td>\n<td>Just the serial<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><code>sudo lshw -short<\/code><\/td>\n<td>One-page hardware summary<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><code>nvme list<\/code><\/td>\n<td>NVMe drives<\/td>\n<td>Some<\/td>\n<\/tr>\n<tr>\n<td><code>nvidia-smi -L<\/code><\/td>\n<td>GPUs<\/td>\n<td>No<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>dmidecode<\/code> reads tables the firmware (BIOS/UEFI) provides, so it shows what the firmware thinks is installed, including empty slots.<\/p>\n<h2>Count checks<\/h2>\n<p>A quick way to catch a missing or unseated part:<\/p>\n<pre><code>sudo dmidecode -t memory | grep -c &quot;Size: 64 GB&quot;    # expect 32 on dc-lab-07\nlspci | grep -c &quot;3D controller&quot;                      # expect 8 GPUs\nlsblk -d | grep -c disk\n<\/code><\/pre>\n<p>If the count is wrong after a repair, something isn't seated, isn't powered, or failed POST.<\/p>\n<h2>Reading lscpu on dc-lab-07<\/h2>\n<p>2 sockets × 56 cores × 2 threads = 224 CPUs. That's the number you compare load averages against, and what you'd expect <code>nproc<\/code> to print. If one socket's memory is missing after a swap, <code>free -h<\/code> would show far less than 2 TiB.<\/p>", "lab": "<p>In your VM (virtual hardware, but the commands are the same):<\/p>\n<pre><code>lscpu\nfree -h\nlspci\nlsblk -o NAME,SIZE,TYPE,MODEL,SERIAL\nsudo dmidecode -t system\nsudo lshw -short\n<\/code><\/pre>", "term": {"intro": "Inventory dc-lab-07.", "tasks": [{"p": "Show the CPU layout", "c": {"t": "re", "v": "^lscpu(\\s*\\|.*)?$"}, "h": "lscpu"}, {"p": "Show total memory in human units", "c": {"t": "re", "v": "^free\\s+-h$"}, "h": "free -h"}, {"p": "Get the chassis serial number for an RMA form", "c": {"t": "re", "v": "^sudo\\s+dmidecode\\s+(-s\\s+system-serial-number|-t\\s+(system|1))(\\s*\\|.*)?$"}, "h": "sudo dmidecode -s system-serial-number"}, {"p": "Count the installed 64 GB DIMMs", "c": {"t": "re", "v": "^sudo\\s+dmidecode\\s+-t\\s+(memory|17)\\s*\\|\\s*grep\\s+-c"}, "h": "sudo dmidecode -t memory | grep -c \"Size: 64 GB\""}, {"p": "List disks with model and serial", "c": {"t": "re", "v": "^lsblk\\s+.*-o\\s+\\S*SERIAL"}, "h": "lsblk -d -o NAME,SIZE,MODEL,SERIAL"}, {"p": "Show the one-page hardware summary", "c": {"t": "re", "v": "^sudo\\s+lshw\\s+-short$"}, "h": "sudo lshw -short"}]}, "quiz": [{"q": "Where does dmidecode get its information?", "o": ["From the disks", "From tables provided by the server's firmware (SMBIOS)", "From the internet"], "c": 1, "why": "dmidecode decodes the SMBIOS/DMI tables the BIOS/UEFI builds at boot."}, {"q": "Which command gives each DIMM's serial number?", "o": ["sudo dmidecode -t memory", "free -h", "lscpu"], "c": 0, "why": "Type 17 (memory) entries list locator, size, part number and serial."}, {"q": "After a memory swap, <code>dmidecode -t memory | grep -c \"Size: 64 GB\"<\/code> shows 31 instead of 32. What does that suggest?", "o": ["Everything is fine", "A DIMM isn't detected: check seating, the slot, or POST logs", "The command needs -v"], "c": 1, "why": "A wrong count is a quick red flag after hardware work."}, {"q": "Which command lists GPUs, NICs and NVMe controllers together?", "o": ["lsblk", "lspci", "lsusb"], "c": 1, "why": "They're all PCIe devices."}]}, {"id": "w5d2", "title": "Memory errors and ECC", "min": 30, "goal": "Read corrected and uncorrected memory errors, map them to a physical DIMM slot, and know the repair flow.", "learn": "<p>Server memory uses <strong>ECC<\/strong> (Error-Correcting Code). Each 64 bits of data carry extra check bits.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Error type<\/th>\n<th>What happens<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CE<\/strong>, corrected error<\/td>\n<td>ECC fixes it silently, the system keeps running, the error is <strong>logged<\/strong><\/td>\n<td>A few is normal. A <strong>rising count on one DIMM<\/strong> predicts failure: plan a replacement<\/td>\n<\/tr>\n<tr>\n<td><strong>UE<\/strong>, uncorrected error<\/td>\n<td>Data is wrong and can't be fixed. Usually a machine check: crash, panic or reboot<\/td>\n<td>Replace urgently; check what else was affected<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The goal at L2 is to replace a DIMM <em>while its errors are still correctable<\/em>, before it causes a crash.<\/p>\n<h2>Where the errors show up<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Source<\/th>\n<th>Command<\/th>\n<th>Shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kernel EDAC driver<\/td>\n<td><code>sudo dmesg -T | grep -i edac<\/code><\/td>\n<td>Each error with socket, memory controller, channel<\/td>\n<\/tr>\n<tr>\n<td>rasdaemon<\/td>\n<td><code>sudo ras-mc-ctl --summary<\/code><\/td>\n<td>Error count <strong>per DIMM label<\/strong><\/td>\n<\/tr>\n<tr>\n<td>rasdaemon<\/td>\n<td><code>sudo ras-mc-ctl --errors<\/code><\/td>\n<td>Every logged event with time<\/td>\n<\/tr>\n<tr>\n<td>edac-utils<\/td>\n<td><code>edac-util -v<\/code><\/td>\n<td>Counts per memory controller<\/td>\n<\/tr>\n<tr>\n<td>BMC<\/td>\n<td><code>sudo ipmitool sel list<\/code><\/td>\n<td>\"Correctable ECC\", \"logging limit reached\" with the slot name<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>From an error to a physical slot<\/h2>\n<p>The kernel describes location as socket / memory controller / channel / DIMM (e.g. <code>CPU_SrcID#1_MC#1_Chan#0_DIMM#0<\/code>). How that maps to a printed slot name <strong>depends on the motherboard<\/strong>. Use:<\/p>\n<ol>\n<li>rasdaemon's <strong>label<\/strong> or the BMC's <strong>slot name<\/strong> (here both say <code>P2-DIMMC1<\/code>),<\/li>\n<li>the server's <strong>DIMM map<\/strong> in the service guide or on the lid label,<\/li>\n<li><code>dmidecode<\/code> to confirm the slot's <strong>serial number<\/strong> before and after.<\/li>\n<\/ol>\n<p>When the OS and the BMC agree on the slot, you can be confident.<\/p>\n<h2>The repair flow<\/h2>\n<ol>\n<li>Confirm the host, the slot and the DIMM serial. Note the error counts.<\/li>\n<li>Make sure the host is <strong>drained<\/strong> (no customer work) per procedure.<\/li>\n<li>Shut down through the approved process, remove power, wear ESD protection.<\/li>\n<li>Replace the DIMM in the exact slot. Check the latch and seating.<\/li>\n<li>Power on. Watch POST (memory training) through the BMC console if possible.<\/li>\n<li>Verify in the OS: correct total memory, the <strong>new serial<\/strong> in <code>dmidecode<\/code>, error counts not growing.<\/li>\n<li>Run a memory test per procedure (vendor diagnostics, or <code>memtester<\/code> from the OS).<\/li>\n<li>Document old and new serials and results. Return to service.<\/li>\n<\/ol>\n<p><strong>If errors return:<\/strong> if they <em>follow the DIMM<\/em> to a new slot, it's the DIMM. If they <em>stay with the slot<\/em> with a new DIMM, suspect the motherboard slot, the CPU socket (bent pins) or the CPU's memory controller. Escalate with that evidence.<\/p>", "lab": "<p>Most VMs don't expose EDAC, but you can still practise reading the tables:<\/p>\n<pre><code>sudo dmidecode -t memory | grep -E &quot;Locator|Size|Serial&quot; | head -n 12\nsudo apt install -y rasdaemon edac-utils\nsudo ras-mc-ctl --status\n<\/code><\/pre>", "term": {"intro": "Work ticket TKT-4411 on dc-lab-07: which DIMM, how bad, what serial?", "tasks": [{"p": "Read the ticket", "c": {"t": "re", "v": "^(cat|less)\\s+(~/|/home/tech/)?tickets/TKT-4411\\.txt$"}, "h": "cat tickets/TKT-4411.txt"}, {"p": "Show the latest EDAC messages from the kernel", "c": {"t": "re", "v": "^sudo\\s+dmesg.*\\|\\s*grep\\s+(-\\w+\\s+)*['\"]?(edac|EDAC)"}, "h": "sudo dmesg -T | grep -i edac | tail -n 2"}, {"p": "Get the error count per DIMM label", "c": {"t": "re", "v": "^sudo\\s+ras-mc-ctl\\s+--summary$"}, "h": "sudo ras-mc-ctl --summary"}, {"p": "Check that the BMC blames the same slot", "c": {"t": "re", "v": "^sudo\\s+ipmitool\\s+sel\\s+(e?list)(\\s*\\|.*)?$"}, "h": "sudo ipmitool sel list | grep -i ecc"}, {"p": "Get the serial number of the DIMM in that slot", "c": {"t": "re", "v": "^sudo\\s+dmidecode\\s+-t\\s+(memory|17)\\s*\\|\\s*grep\\s+.*-A\\s*\\d+.*P2-DIMMC1|^sudo\\s+dmidecode\\s+-t\\s+(memory|17)\\s*\\|\\s*grep\\s+.*P2-DIMMC1.*-A\\s*\\d+"}, "h": "sudo dmidecode -t memory | grep -A 6 \"Locator: P2-DIMMC1\""}]}, "quiz": [{"q": "What's the difference between a CE and a UE?", "o": ["A CE was corrected by ECC and the system kept running; a UE couldn't be corrected", "A CE is in the CPU, a UE in the memory", "There is no difference"], "c": 0, "why": "Corrected vs uncorrected. UEs usually crash or reset the machine."}, {"q": "One DIMM has a steadily rising CE count. What's the right plan?", "o": ["Ignore it, ECC fixed them", "Plan a replacement before it turns into uncorrected errors", "Reboot to clear the counter"], "c": 1, "why": "Rising CEs are a predictor. Replacing early avoids a crash."}, {"q": "After replacing P2-DIMMC1, the errors continue on P2-DIMMC1 with the new DIMM. What do you suspect?", "o": ["The new DIMM is also bad, order a third", "The slot, the CPU socket or the memory controller: the fault stayed with the location", "The OS driver"], "c": 1, "why": "Errors that stay with the location point to the board or CPU. Escalate with evidence."}, {"q": "How do you prove the new DIMM is the one in the slot?", "o": ["Compare the serial in <code>dmidecode -t memory<\/code> with the label on the new DIMM", "Check that free -h shows memory", "Run uptime"], "c": 0, "why": "The serial ties the physical part to what the OS sees."}]}, {"id": "w5d3", "title": "Disks: SMART and NVMe health", "min": 30, "goal": "Decide whether a disk is failing by reading SMART and NVMe health, not just the PASSED line.", "learn": "<h2>Disk types and names<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Interface<\/th>\n<th>Linux name<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>HDD (spinning)<\/td>\n<td>SATA / SAS<\/td>\n<td><code>/dev/sda<\/code>, <code>/dev/sdb<\/code>…<\/td>\n<\/tr>\n<tr>\n<td>SATA/SAS SSD<\/td>\n<td>SATA / SAS<\/td>\n<td><code>/dev/sdX<\/code> too<\/td>\n<\/tr>\n<tr>\n<td>NVMe SSD<\/td>\n<td>PCIe<\/td>\n<td><code>/dev/nvme0n1<\/code> (controller 0, namespace 1)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Names can change between boots.<\/strong> <code>sdb<\/code> today might be <code>sdc<\/code> after a reboot or a disk swap. Identify disks by <strong>serial number<\/strong> (<code>lsblk -o NAME,SERIAL<\/code> or <code>ls -l /dev/disk/by-id/<\/code>) and physical <strong>slot<\/strong>, and use the drive's locate LED when available.<\/p>\n<h2>SMART<\/h2>\n<p>SMART is the drive's own health record. <code>smartctl<\/code> (package smartmontools) reads it.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Command<\/th>\n<th>Shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>sudo smartctl -H /dev/sdb<\/code><\/td>\n<td>Overall verdict: PASSED / FAILED<\/td>\n<\/tr>\n<tr>\n<td><code>sudo smartctl -i /dev/sdb<\/code><\/td>\n<td>Model, serial, firmware, capacity<\/td>\n<\/tr>\n<tr>\n<td><code>sudo smartctl -A /dev/sdb<\/code><\/td>\n<td>The attribute table<\/td>\n<\/tr>\n<tr>\n<td><code>sudo smartctl -a /dev/sdb<\/code><\/td>\n<td>Everything, including the error log<\/td>\n<\/tr>\n<tr>\n<td><code>sudo smartctl -t short /dev/sdb<\/code><\/td>\n<td>Start a short self-test (results later in <code>-a<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Attributes that matter<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Name<\/th>\n<th>Bad sign<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>Reallocated_Sector_Ct<\/td>\n<td>Bad sectors already swapped for spares. Growing = dying<\/td>\n<\/tr>\n<tr>\n<td>197<\/td>\n<td>Current_Pending_Sector<\/td>\n<td>Sectors that couldn't be read, waiting to be reallocated<\/td>\n<\/tr>\n<tr>\n<td>198<\/td>\n<td>Offline_Uncorrectable<\/td>\n<td>Sectors that failed in background scans<\/td>\n<\/tr>\n<tr>\n<td>187<\/td>\n<td>Reported_Uncorrect<\/td>\n<td>Errors the drive couldn't correct<\/td>\n<\/tr>\n<tr>\n<td>199<\/td>\n<td>UDMA_CRC_Error_Count<\/td>\n<td>Data corrupted <strong>on the cable/backplane<\/strong>, not the platters. Reseat or replace the cable first<\/td>\n<\/tr>\n<tr>\n<td>194<\/td>\n<td>Temperature_Celsius<\/td>\n<td>Running hot<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Power_On_Hours<\/td>\n<td>Age<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Look at the <strong>RAW_VALUE<\/strong> column for counts. VALUE/WORST/THRESH are normalised scores, and the drive only says FAILED when VALUE drops below THRESH. That's why a drive can say <strong>PASSED while it's clearly failing<\/strong>, like sdb on dc-lab-07: 312 reallocated, 24 pending, kernel I/O errors and kicked out of the RAID.<\/p>\n<h2>NVMe health<\/h2>\n<pre><code>sudo nvme smart-log /dev/nvme0\n<\/code><\/pre>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Watch for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>critical_warning<\/code><\/td>\n<td>Anything other than 0<\/td>\n<\/tr>\n<tr>\n<td><code>media_errors<\/code><\/td>\n<td>Above 0<\/td>\n<\/tr>\n<tr>\n<td><code>percentage_used<\/code><\/td>\n<td>Wear; 100% = rated endurance used<\/td>\n<\/tr>\n<tr>\n<td><code>available_spare<\/code><\/td>\n<td>Dropping toward the threshold<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Verdict<\/h2>\n<p>Replace a disk when SMART counters are growing, the kernel logs I/O errors on it, or RAID has failed it. CRC errors alone point at the cable or backplane first.<\/p>", "lab": "<p>In your VM <code>smartctl<\/code> will mostly say the virtual disk has no SMART support. Practise the commands and read the man page:<\/p>\n<pre><code>lsblk -o NAME,SIZE,TYPE,MODEL,SERIAL\nls -l /dev/disk/by-id/\nsudo smartctl -i /dev/sda\nman smartctl\n<\/code><\/pre>", "term": {"intro": "Decide whether sdb on dc-lab-07 is really failing.", "tasks": [{"p": "List disks with model, serial, rotation and transport", "c": {"t": "re", "v": "^lsblk\\s+.*-o\\s+\\S*SERIAL"}, "h": "lsblk -d -o NAME,SIZE,MODEL,SERIAL,ROTA,TRAN"}, {"p": "Get the overall SMART verdict for sdb", "c": {"t": "re", "v": "^sudo\\s+smartctl\\s+-H\\s+/dev/sdb$"}, "h": "sudo smartctl -H /dev/sdb"}, {"p": "Read sdb's SMART attribute table", "c": {"t": "re", "v": "^sudo\\s+smartctl\\s+-(A|a|x)\\s+/dev/sdb"}, "h": "sudo smartctl -A /dev/sdb"}, {"p": "Compare with the healthy disk sda (reallocated, pending, CRC)", "c": {"t": "re", "v": "^sudo\\s+smartctl\\s+-(A|a)\\s+/dev/sda.*\\|\\s*grep"}, "h": "sudo smartctl -A /dev/sda | grep -E \"Realloc|Pending|CRC\""}, {"p": "Check the NVMe drive's health log", "c": {"t": "re", "v": "^sudo\\s+nvme\\s+smart-log\\s+/dev/nvme0(n1)?$"}, "h": "sudo nvme smart-log /dev/nvme0"}]}, "quiz": [{"q": "sdb says \"SMART overall-health: PASSED\" but has 312 reallocated and 24 pending sectors, and the kernel logs I/O errors on it. Verdict?", "o": ["It's fine, it passed", "It's failing: replace it", "Run a long test and ignore it if it passes"], "c": 1, "why": "PASSED only means no normalised value crossed its threshold yet. The raw counts and kernel errors tell the truth."}, {"q": "A disk shows a growing UDMA_CRC_Error_Count but no reallocated or pending sectors. First step?", "o": ["Reseat or replace the cable/backplane connection", "Replace the disk immediately", "Reformat the disk"], "c": 0, "why": "CRC errors happen in transit. Fix the connection first."}, {"q": "Why identify a disk by serial instead of /dev/sdb?", "o": ["Serials are shorter", "Device names can change between boots or after swaps", "smartctl only accepts serials"], "c": 1, "why": "sdb today can be sdc tomorrow. Serial + slot is reliable."}, {"q": "On NVMe, which field shows wear against the drive's rated endurance?", "o": ["media_errors", "percentage_used", "critical_warning"], "c": 1, "why": "percentage_used of 100% means the rated write endurance is used up."}]}, {"id": "w5d4", "title": "Filesystems, mounts and RAID", "min": 30, "goal": "Read how disks become mount points, check RAID health, and know the safe way to replace a RAID member.", "learn": "<h2>Disk → partition → filesystem → mount point<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Example<\/th>\n<th>Command<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Disk<\/td>\n<td><code>/dev/sda<\/code><\/td>\n<td><code>lsblk<\/code><\/td>\n<\/tr>\n<tr>\n<td>Partition<\/td>\n<td><code>/dev/sda2<\/code><\/td>\n<td><code>lsblk<\/code>, <code>sudo fdisk -l<\/code><\/td>\n<\/tr>\n<tr>\n<td>RAID / volume<\/td>\n<td><code>/dev/md0<\/code><\/td>\n<td><code>cat /proc/mdstat<\/code><\/td>\n<\/tr>\n<tr>\n<td>Filesystem<\/td>\n<td>ext4, xfs, vfat<\/td>\n<td><code>lsblk -f<\/code>, <code>blkid<\/code><\/td>\n<\/tr>\n<tr>\n<td>Mount point<\/td>\n<td><code>/<\/code>, <code>/data<\/code><\/td>\n<td><code>findmnt<\/code>, <code>mount<\/code>, <code>df -h<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Filesystems are mounted at boot from <code>/etc/fstab<\/code>, usually by <strong>UUID<\/strong> because UUIDs don't change when device names do. <code>df -h<\/code> shows space per mounted filesystem, <code>df -i<\/code> shows inodes.<\/p>\n<h2>RAID levels<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Level<\/th>\n<th>How<\/th>\n<th>Survives<\/th>\n<th>Usable space<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>RAID 0<\/td>\n<td>Stripe<\/td>\n<td><strong>No<\/strong> disk failure<\/td>\n<td>100%<\/td>\n<\/tr>\n<tr>\n<td>RAID 1<\/td>\n<td>Mirror<\/td>\n<td>1 disk (of 2)<\/td>\n<td>50%<\/td>\n<\/tr>\n<tr>\n<td>RAID 5<\/td>\n<td>Stripe + parity<\/td>\n<td>1 disk<\/td>\n<td>n−1 disks<\/td>\n<\/tr>\n<tr>\n<td>RAID 6<\/td>\n<td>Stripe + double parity<\/td>\n<td>2 disks<\/td>\n<td>n−2 disks<\/td>\n<\/tr>\n<tr>\n<td>RAID 10<\/td>\n<td>Mirrors, striped<\/td>\n<td>1 per mirror pair<\/td>\n<td>50%<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>RAID protects against disk failure, <strong>not<\/strong> against deletion or corruption. It's not a backup.<\/p>\n<h2>Software RAID (mdadm)<\/h2>\n<pre><code>cat /proc/mdstat\nsudo mdadm --detail /dev/md0\n<\/code><\/pre>\n<p>In <code>/proc/mdstat<\/code>, <code>[UU]<\/code> means both mirror members are up. <code>[U_]<\/code> means one is missing, and <code>(F)<\/code> marks a faulty member. In <code>mdadm --detail<\/code>, look for <code>State : clean, degraded<\/code> and which device is <code>faulty<\/code>.<\/p>\n<h2>Replacing a failed RAID member (software RAID)<\/h2>\n<ol>\n<li>Confirm the failed disk by <strong>serial and slot<\/strong>, not just the name. Match the BMC's \"Drive Fault\" slot.<\/li>\n<li><code>sudo mdadm --manage /dev/md0 --remove /dev/sdb2<\/code> (mark it failed first with <code>--fail<\/code> if it isn't).<\/li>\n<li>Replace the physical disk.<\/li>\n<li>Copy the partition layout from the good disk, e.g. <code>sudo sfdisk -d /dev/sda | sudo sfdisk /dev/sdb<\/code>.<\/li>\n<li><code>sudo mdadm --manage /dev/md0 --add /dev/sdb2<\/code>.<\/li>\n<li>Watch <code>/proc/mdstat<\/code> until the recovery reaches 100%. On a boot mirror, also install the bootloader on the new disk per procedure.<\/li>\n<\/ol>\n<p><strong>The most expensive mistake:<\/strong> pulling the <em>healthy<\/em> disk from a degraded array. With RAID 1 that's all your data gone. Check the serial twice and use the locate LED.<\/p>\n<h2>Hardware RAID<\/h2>\n<p>Many servers use a RAID controller instead of mdadm. The disks hide behind the controller, and you use the vendor's tool (for example <code>storcli<\/code>, <code>perccli<\/code> or <code>ssacli<\/code>) or the BMC to see array and disk state. The same rules apply.<\/p>", "lab": "<p>In your VM:<\/p>\n<pre><code>lsblk -f\nfindmnt\ncat /etc/fstab\ndf -h\ndf -i\ncat /proc/mdstat\n<\/code><\/pre>\n<p>Advanced, optional: add two small virtual disks to a fresh VM and build a RAID 1 with <code>mdadm<\/code>, then fail and replace one. Search \"mdadm create raid1\" when you're ready.<\/p>", "term": {"intro": "Check dc-lab-07's storage layout. (You'll replace the disk in week 9.)", "tasks": [{"p": "Read the software RAID status", "c": {"t": "re", "v": "^cat\\s+/proc/mdstat$"}, "h": "cat /proc/mdstat"}, {"p": "Show the detailed state of md0", "c": {"t": "re", "v": "^sudo\\s+mdadm\\s+(--detail|-D)\\s+/dev/md0$"}, "h": "sudo mdadm --detail /dev/md0"}, {"p": "Show filesystems, labels and UUIDs for every disk", "c": {"t": "re", "v": "^(lsblk\\s+-f|sudo\\s+blkid|blkid)$"}, "h": "lsblk -f"}, {"p": "Read how filesystems are mounted at boot", "c": {"t": "re", "v": "^cat\\s+/etc/fstab$"}, "h": "cat /etc/fstab"}, {"p": "Check space on every filesystem", "c": {"t": "re", "v": "^df\\s+-h$"}, "h": "df -h"}, {"p": "Check inode usage", "c": {"t": "re", "v": "^df\\s+-i$"}, "h": "df -i"}]}, "quiz": [{"q": "/proc/mdstat shows <code>[2/1] [U_]<\/code>. What does it mean?", "o": ["The array expects 2 members but only 1 is working", "The array is healthy", "The array is rebuilding at 50%"], "c": 0, "why": "[U_] = one Up, one missing. The array is degraded."}, {"q": "Which RAID level survives no disk failures at all?", "o": ["RAID 0", "RAID 1", "RAID 5"], "c": 0, "why": "RAID 0 only stripes for speed. Lose one disk, lose everything."}, {"q": "Why does /etc/fstab usually use UUIDs?", "o": ["They are shorter than device names", "UUIDs stay the same even if device names like sdb change", "The kernel can't read device names"], "c": 1, "why": "Device names can shift. UUIDs belong to the filesystem."}, {"q": "A RAID 1 array is degraded. Which disk must you be most careful NOT to pull?", "o": ["The failed one", "The healthy one: it holds the only copy of the data", "Any of them, RAID protects you"], "c": 1, "why": "In a degraded mirror, the remaining disk is the last copy."}, {"q": "Is RAID a backup?", "o": ["Yes, it keeps two copies", "No: it protects against disk failure, not deletion or corruption", "Only RAID 6"], "c": 1, "why": "A deleted or corrupted file is deleted or corrupted on every mirror."}]}, {"id": "w5d5", "title": "The BMC and IPMI", "min": 25, "goal": "Use the BMC to read hardware events and sensors, find the right server, and see its console, even when the OS is down.", "learn": "<p>The <strong>BMC<\/strong> (Baseboard Management Controller) is a small computer on the motherboard with its <strong>own network port and IP<\/strong>. It runs whenever the server has power, even if the server itself is off or the OS has crashed. Vendors brand it (iDRAC, iLO, XClarity, Supermicro IPMI), but the idea is the same: <strong>out-of-band management<\/strong>.<\/p>\n<p>The BMC can:<\/p>\n<ul>\n<li>read sensors (temperatures, fans, voltages, PSUs),<\/li>\n<li>keep the <strong>System Event Log (SEL)<\/strong> of hardware events,<\/li>\n<li>power the server on, off or cycle it,<\/li>\n<li>blink the <strong>locate LED<\/strong>,<\/li>\n<li>show the console (<strong>Serial over LAN<\/strong>) and often a remote screen (KVM),<\/li>\n<li>hold inventory (FRU: serial numbers, part numbers).<\/li>\n<\/ul>\n<h2>Talking to it: ipmitool<\/h2>\n<p>From the server itself (in-band, needs root):<\/p>\n<pre><code>sudo ipmitool sel list\n<\/code><\/pre>\n<p>From another machine over the management network (out-of-band):<\/p>\n<pre><code>ipmitool -I lanplus -H 10.250.7.17 -U ADMIN -E sel list\n<\/code><\/pre>\n<p><code>-E<\/code> reads the password from the <code>IPMI_PASSWORD<\/code> environment variable so it doesn't end up in your shell history.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Command<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>sel list<\/code> / <code>sel elist<\/code><\/td>\n<td>Hardware event log (start every investigation here)<\/td>\n<\/tr>\n<tr>\n<td><code>sdr<\/code> / <code>sensor<\/code><\/td>\n<td>Sensor readings and status<\/td>\n<\/tr>\n<tr>\n<td><code>chassis status<\/code><\/td>\n<td>Power state, faults (drive, fan, power)<\/td>\n<\/tr>\n<tr>\n<td><code>chassis power status<\/code><\/td>\n<td>On or off<\/td>\n<\/tr>\n<tr>\n<td><code>chassis power on/off/cycle<\/code><\/td>\n<td><strong>Changes state. Ticket and procedure only<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>chassis identify 30<\/code><\/td>\n<td>Blink the locate LED for 30 s<\/td>\n<\/tr>\n<tr>\n<td><code>fru print<\/code><\/td>\n<td>Serials and part numbers for chassis, board, PSUs<\/td>\n<\/tr>\n<tr>\n<td><code>lan print 1<\/code><\/td>\n<td>The BMC's own network settings<\/td>\n<\/tr>\n<tr>\n<td><code>sol activate<\/code><\/td>\n<td>Serial console (end with <code>~.<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Redfish<\/h2>\n<p>Newer servers also have <strong>Redfish<\/strong>, a REST API over HTTPS that does the same jobs in JSON (e.g. <code>https://&lt;bmc&gt;/redfish/v1/Systems/1<\/code>). Large fleets use it for automation. Knowing the name helps in an interview.<\/p>\n<h2>Rules of thumb<\/h2>\n<ul>\n<li><strong>Don't clear the SEL<\/strong> until the events are in the ticket and procedure allows it. It's evidence.<\/li>\n<li>Check the SEL <strong>before<\/strong> and <strong>after<\/strong> hardware work.<\/li>\n<li>Use <strong>identify<\/strong> to find the right chassis in a row of identical servers, then double-check the asset label.<\/li>\n<li>BMC clocks may be in UTC. Check before comparing times with OS logs.<\/li>\n<\/ul>", "lab": "<p>Your VM has no BMC. Instead, read the manual and practise the syntax:<\/p>\n<pre><code>man ipmitool\nipmitool help\n<\/code><\/pre>\n<p>If you ever get access to a real server's BMC web interface, find the System Event Log, sensors and the remote console. It's the same information ipmitool shows.<\/p>", "term": {"intro": "Use dc-lab-07's BMC.", "tasks": [{"p": "Try reading the event log without sudo", "c": {"t": "fail", "v": "^ipmitool\\s+sel\\s+e?list$"}, "h": "ipmitool sel list"}, {"p": "Read the System
